<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>班级大屏系统</title>
<link rel="icon" href="assets/classroom.png">
<style>
:root{--bg:#eef2f7;--card:#fff;--ink:#1f2937;--muted:#6b7280;--brand:#2563eb;--brand-d:#1d4ed8;--brand-l:#dbeafe;--ok:#16a34a;--ok-l:#dcfce7;--warn:#d97706;--danger:#dc2626;--danger-l:#fee2e2;--line:#e5e7eb;--radius:14px;--shadow:0 1px 3px rgba(15,23,42,.08),0 6px 20px rgba(15,23,42,.06)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
button{font-family:inherit;cursor:pointer}input,select,textarea{font-family:inherit;font-size:14px}a{color:var(--brand);text-decoration:none}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#e8f0fe,#f5f7fb 45%,#eef6ff)}
.auth-card{background:#fff;border-radius:20px;box-shadow:var(--shadow);width:100%;max-width:420px;padding:36px 34px}
.auth-logo{width:60px;height:60px;border-radius:17px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;margin:0 auto 14px}
.auth-title{text-align:center;font-size:22px;font-weight:700;margin-bottom:4px}
.auth-sub{text-align:center;color:var(--muted);font-size:14px;margin-bottom:26px}
.field{margin-bottom:15px}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:500}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;outline:none}
.field input:focus,.field select:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-l)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:10px;font-size:15px;font-weight:600;padding:11px 18px;transition:.15s}
.btn-block{width:100%}.btn-primary{background:var(--brand);color:#fff}.btn-primary:hover{background:var(--brand-d)}
.btn-ghost{background:#fff;color:var(--brand);border:1px solid var(--brand)}.btn-ghost:hover{background:var(--brand-l)}
.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{background:#b91c1c}
.btn-ok{background:var(--ok);color:#fff}.btn-sm{padding:7px 12px;font-size:13px;border-radius:8px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 22px;border-radius:10px;font-size:14px;z-index:9999;opacity:0;transition:opacity .25s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.2)}.toast.show{opacity:1}
.app{display:flex;min-height:100vh}
.sidebar{width:220px;background:#111a2e;color:#cbd5e1;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.side-brand{display:flex;align-items:center;gap:10px;padding:20px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
.side-brand .logo{width:34px;height:34px;border-radius:9px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px}
.side-brand .name{color:#fff;font-weight:600;font-size:15px}
.nav{flex:1;overflow-y:auto;padding:12px 10px}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;cursor:pointer;font-size:14px;color:#cbd5e1;transition:.12s;margin-bottom:2px;border:none;background:none;width:100%;text-align:left}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}.nav-item.active{background:var(--brand);color:#fff;font-weight:600}
.nav-item .ico{width:18px;height:18px;flex-shrink:0}
.side-user{padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:13px}
.side-user .uname{color:#fff;font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.main{flex:1;min-width:0;padding:24px 28px;overflow-x:hidden}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-title{font-size:22px;font-weight:700}.page-desc{color:var(--muted);font-size:13px;margin-top:3px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:18px}
.card-title{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.stat{display:flex;flex-direction:column;gap:4px;padding:16px;border-radius:12px;background:#f8fafc;border:1px solid var(--line)}
.stat .n{font-size:26px;font-weight:800;color:var(--brand)}.stat .l{font-size:12px;color:var(--muted)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input,.toolbar select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;outline:none}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl th{background:#f8fafc;color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap}.tbl tr:hover td{background:#f8fafc}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600}
.chip.ok{background:var(--ok-l);color:var(--ok)}.chip.warn{background:#fef3c7;color:var(--warn)}.chip.gray{background:#e5e7eb;color:#4b5563}.chip.brand{background:var(--brand-l);color:var(--brand-d)}
.badge3{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-size:13px;font-weight:800}
.b1{background:#fde68a;color:#92400e}.b2{background:#e5e7eb;color:#374151}.b3{background:#fcd9b6;color:#9a3412}
.honor-card{border:1px solid var(--line);border-radius:12px;padding:16px;text-align:center;background:linear-gradient(180deg,#fffdf5,#fff)}
.honor-card .medal{font-size:34px;margin-bottom:6px}.honor-card .nm{font-weight:700;font-size:16px}.honor-card .tp{color:var(--muted);font-size:12px;margin-top:4px}
.honor-card.top{background:linear-gradient(180deg,#fffbeb,#fff);border-color:#fcd34d}
.seat-grid{display:grid;gap:8px}.seat-grid .cell{border:1px solid var(--line);border-radius:8px;padding:8px 4px;text-align:center;font-size:12px;background:#f8fafc;min-height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.seat-grid .cell.filled{background:var(--brand-l);border-color:#93c5fd;font-weight:600}
.col-head{display:flex;align-items:center;justify-content:center;font-weight:700;padding:8px;background:var(--brand-l);color:var(--brand-d);border-radius:8px;margin-bottom:6px;user-select:none;font-size:13px}
.col-head .mini{font-size:10px;color:var(--muted);margin-left:4px}
.row-label{display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted)}
.sched-grid{display:grid;gap:6px}.sched-grid .cell{border:1px solid var(--line);border-radius:8px;padding:8px;font-size:12px;text-align:center;background:#fff;min-height:52px;display:flex;align-items:center;justify-content:center}
.sched-grid .cell.filled{font-weight:600;color:#fff}
.form-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.form-row .field{margin-bottom:0;flex:1;min-width:120px}
.list-item{display:flex;align-items:center;justify-content:space-between;padding:9px 4px;border-bottom:1px dashed var(--line);font-size:14px}
.empty{text-align:center;color:var(--muted);padding:36px 10px;font-size:14px}
.duty-cell{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.mini-input{width:52px;padding:5px 6px;border:1px solid var(--line);border-radius:6px;outline:none;text-align:center}.mini-input:focus{border-color:var(--brand)}
.backdrop{position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:40;display:none;align-items:center;justify-content:center;padding:20px}.backdrop.open{display:flex}
.modal{background:#fff;border-radius:16px;box-shadow:var(--shadow);width:100%;max-width:520px;max-height:88vh;overflow-y:auto;padding:24px}
.modal h3{font-size:17px;margin-bottom:16px}
.mode-tabs{display:flex;gap:6px}
.mode-tab{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
.mode-tab.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.subj-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.subj-chip{padding:5px 12px;border-radius:999px;background:#f1f5f9;border:1px solid var(--line);cursor:pointer;font-size:13px}
.subj-chip.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.hw-grade-badge{padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600}
.g-sub{background:var(--ok-l);color:var(--ok)}.g-ok{background:#dcfce7;color:#15803d}.g-good{background:var(--brand-l);color:var(--brand-d)}.g-pass{background:#fef3c7;color:#b45309}.g-fail{background:var(--danger-l);color:var(--danger)}.g-none{background:#e5e7eb;color:#6b7280}
.code-input{font-size:30px;letter-spacing:10px;text-align:center;font-weight:700;padding:14px!important}
@media(max-width:820px){.app{flex-direction:column}.sidebar{width:100%;height:auto;position:relative;flex-direction:row;align-items:center}
.side-brand{padding:12px 14px;border-bottom:none}.nav{display:flex;overflow-x:auto;padding:8px;gap:4px}.nav-item{white-space:nowrap;flex-shrink:0}
.side-user{margin-left:auto;border-top:none;border-left:1px solid rgba(255,255,255,.08)}.main{padding:16px}
.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}.field input,.toolbar input,.mini-input,.form-row select{font-size:16px}.btn{min-height:44px}.auth-sub{font-size:14px}}
@media(min-width:1500px){
  body{font-size:18px}.sidebar{width:260px}
  .side-brand{padding:26px 22px}.side-brand .logo{width:44px;height:44px;font-size:20px;border-radius:12px}
  .side-brand .name{font-size:19px}.nav{padding:16px 14px}
  .nav-item{font-size:17px;padding:14px 16px;border-radius:11px;gap:13px}.nav-item .ico{width:22px;height:22px}
  .side-user{padding:18px 20px;font-size:15px}.main{padding:36px 44px}
  .page-title{font-size:32px}.page-desc{font-size:16px}
  .card{padding:28px;border-radius:18px;margin-bottom:22px}.card-title{font-size:19px}
  .tbl{font-size:17px}.tbl th,.tbl td{padding:14px 16px}
  .btn{font-size:17px;padding:13px 22px;border-radius:12px}.btn-sm{padding:9px 15px;font-size:15px}
  .field input,.field select,.field textarea{padding:14px 14px;font-size:16px}
  .toolbar input,.toolbar select{padding:11px 13px;font-size:16px}
  .stat{padding:22px}.stat .n{font-size:36px}.stat .l{font-size:15px}
  .mini-input{width:60px;padding:7px 6px;font-size:15px}
  .seat-grid .cell{font-size:14px;min-height:54px}.sched-grid .cell{font-size:14px;min-height:60px}
  .list-item{font-size:16px;padding:12px 6px}.honor-card .nm{font-size:20px}.honor-card .medal{font-size:42px}
  .chip{font-size:14px;padding:3px 12px}.toast{font-size:16px;padding:14px 26px}
}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";
/* ===== Supabase 连接（与教师端、管理员后台同一数据库） ===== */
const SUPABASE_URL="https://spdhjjgcuhynebtupsqz.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNwZGhqamdjdWh5bmVidHVwc3F6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3MDQ0NTUsImV4cCI6MjEwNzI4MDQ1NX0.L_38nssMKy6vWS64eU01aZ_wBy9dhkuA3JlxCogfzzw";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:true}});
/* ===== 工具 ===== */
function $id(i){return document.getElementById(i);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function toast(m){const t=$id("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2400);}
function genCode(n){let c="";for(let i=0;i<n;i++)c+=Math.floor(Math.random()*10);return c;}
function errMsg(e){const m=e&&e.message?e.message:String(e);return m;}
function fmtYMD(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
/* ===== 数据访问 ===== */
async function fetchRows(table,filter){let q=sb.from(table).select("*");if(filter){if(filter.eq)Object.entries(filter.eq).forEach(([k,v])=>q=q.eq(k,v));if(filter.in)Object.entries(filter.in).forEach(([k,v])=>q=q.in(k,v));}const {data,error}=await q;if(error)throw error;return data||[];}
async function fetchOne(table,filter){const {data,error}=await sb.from(table).select("*").match(filter).maybeSingle();if(error)throw error;return data;}
async function insertRow(table,row){const {data,error}=await sb.from(table).insert(row).select().single();if(error)throw error;return data;}
async function insertMany(table,rows){const {data,error}=await sb.from(table).insert(rows);if(error)throw error;return data;}
async function updateRows(table,filter,patch){const {data,error}=await sb.from(table).update(patch).match(filter);if(error)throw error;return data;}
async function deleteRows(table,filter){const {error}=await sb.from(table).delete().match(filter);if(error)throw error;}
/* ===== 写操作鉴权（大屏读可匿名，写须教师账号登录） ===== */
function acctToEmail(loginName){
  const hex=Array.from(new TextEncoder().encode(String(loginName==null?"":loginName)))
    .map(b=>b.toString(16).padStart(2,"0")).join("");
  return hex+"@class.local";
}
function acctFromEmail(email){
  if(!email||!email.includes("@"))return email||"";
  const hex=email.split("@")[0];
  try{ const bytes=new Uint8Array(hex.match(/.{1,2}/g).map(h=>parseInt(h,16))); return new TextDecoder().decode(bytes); }catch(e){ return email; }
}
let _writerLoginResolve=null;
/* 返回当前已登录且任教于当前班级的教师账号；未登录则弹窗要求登录 */
async function requireWriter(){
  try{
    const {data:{session}}=await sb.auth.getSession();
    if(session&&session.user){
      const acc=await fetchOne("user_account",{auth_id:session.user.id});
      if(acc&&acc.role==="teacher"&&BIG.classId){
        const rel=await fetchOne("class_user_rel",{class_id:BIG.classId,user_id:acc.id});
        if(rel) return acc;
      }
    }
  }catch(e){}
  await new Promise(resolve=>{ _writerLoginResolve=resolve; showWriterLogin(); });
  return null;
}
function showWriterLogin(){
  closeModal("wl_modal");
  $id("app").insertAdjacentHTML("beforeend",`<div class="backdrop open" id="wl_modal"><div class="modal"><h3>教师身份验证（仅用于本班写操作）</h3>
    <div class="field"><label>教师账号</label><input id="wl_user" placeholder="请输入账号"></div>
    <div class="field"><label>密码</label><input id="wl_pass" type="password" placeholder="请输入密码"></div>
    <div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn btn-ghost" onclick="closeModal('wl_modal')">取消</button><button class="btn btn-primary" onclick="doWriterLogin()">验证登录</button></div>
    <div style="font-size:13px;color:var(--muted);margin-top:10px">说明：大屏浏览无需登录；涉及记分、成绩、作业、兑换、请假等修改时需以任教本班的教师账号登录。</div></div></div>`);
  setTimeout(()=>{const u=$id("wl_user");if(u)u.focus();},50);
}
async function doWriterLogin(){
  const u=$id("wl_user").value.trim(),p=$id("wl_pass").value;
  if(!u||!p){toast("请输入账号和密码");return;}
  try{
    const {data,error}=await sb.auth.signInWithPassword({email:acctToEmail(u),password:p});
    if(error){ toast("登录失败："+errMsg(error)); return; }
    const acc=await fetchOne("user_account",{auth_id:data.user.id});
    if(!acc||acc.role!=="teacher"){ await sb.auth.signOut(); toast("该账号不是教师"); return; }
    if(BIG.classId){
      const rel=await fetchOne("class_user_rel",{class_id:BIG.classId,user_id:acc.id});
      if(!rel){ await sb.auth.signOut(); toast("该教师未任教本班，无法操作"); return; }
    }
    closeModal("wl_modal");
    toast("已登录："+(acc.login_name||acctFromEmail(data.user.email)));
    const r=_writerLoginResolve; _writerLoginResolve=null; if(r)r();
  }catch(e){ toast("登录失败："+errMsg(e)); }
}
/* ===== 大屏状态（班级码登录） ===== */
let BIG={classId:null,nav:"dashboard",dutyMode:"fixed",dutyWeek:null,scoreSubject:"",hwId:null,subj:""};
let bigCache={ms:[],subs:[],hwId:null};
function loadBig(){try{BIG=Object.assign({classId:null,nav:"dashboard",dutyMode:"fixed",dutyWeek:null,scoreSubject:"",hwId:null,subj:""},JSON.parse(localStorage.getItem("big_screen")||"{}"));}catch(e){BIG={classId:null,nav:"dashboard",dutyMode:"fixed",dutyWeek:null,scoreSubject:"",hwId:null,subj:""};}return BIG;}
function saveBig(){localStorage.setItem("big_screen",JSON.stringify(BIG));}
function go(nav){loadBig();BIG.nav=nav;saveBig();renderBig();}
let bigTimer=null;

async function viewToday(cls){
  setTimeout(()=>{ if($id("today_box"))renderToday(); },60);
  return `<div class="page-head"><div><div class="page-title">今日安排</div><div class="page-desc">今日课程、下节课提醒、倒计时</div></div></div>
  <div class="card" id="today_box" style="min-height:420px"></div>`;
}
async function renderToday(){
  const box=$id("today_box"); if(!box)return;
  let sched=null,cd=[]; try{ sched=await fetchOne("schedules",{class_id:BIG.classId}); cd=await fetchRows("countdown",{eq:{class_id:BIG.classId}}); }catch(e){}
  const now=new Date();
  const dayIdx=(now.getDay()+6)%7;
  const wd=["周一","周二","周三","周四","周五","周六","周日"];
  const periods=sched?sched.period_count:8;
  const grid=sched&&sched.grid?sched.grid:[];
  const times=sched&&sched.period_times?sched.period_times:[];
  const todayCourse=grid[dayIdx]||[];
  const curHM=String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
  let curIdx=-1; for(let i=0;i<times.length;i++){ if(times[i]&&curHM>=times[i])curIdx=i; }
  const nextIdx=curIdx+1;
  const nextCourse=(nextIdx<todayCourse.length?todayCourse[nextIdx]:"")||"";
  const nextTime=times[nextIdx]||"";
  let minsLeft=-1; if(nextTime){ const p=nextTime.split(":").map(Number); minsLeft=Math.max(0,(p[0]*60+p[1])-(now.getHours()*60+now.getMinutes())); }
  const todayStr=now.toISOString().slice(0,10);
  const cds=cd.filter(x=>x.date>=todayStr).sort((a,b)=>(a.date||"").localeCompare(b.date||"")).slice(0,4);
  let rows="";
  for(let i=0;i<periods;i++){
    const subj=todayCourse[i]||"";
    const t=times[i]||"";
    const active=i===curIdx;
    let bg,color,extra,border="";
    if(active){ bg="#eef2ff"; color="#4338ca"; border="border:2px solid #6366f1;"; extra='<span style="color:#6366f1;font-weight:800;font-size:14px">● 现在</span>'; }
    else if(subj){ bg="#f8fafc"; color="#1e293b"; extra=""; }
    else { bg="#f1f5f9"; color="#94a3b8"; extra=""; }
    const subjText=subj||"（空）";
    rows+='<div style="display:flex;align-items:center;gap:14px;padding:13px 18px;border-radius:11px;background:'+bg+';'+border+'"><span style="width:60px;font-weight:700;color:#334155;font-size:17px">第'+(i+1)+'节</span><span style="flex:1;font-size:21px;color:'+color+';font-weight:'+(active?"800":"600")+'">'+esc(subjText)+'</span><span style="color:#64748b;font-size:16px">'+esc(t)+'</span>'+extra+'</div>';
  }
  let cdHtml="";
  for(const x of cds){
    const d=Math.ceil((new Date(x.date)-new Date(todayStr))/86400000);
    cdHtml+='<div style="background:linear-gradient(135deg,#eef2ff,#fdf2f8);border-radius:14px;padding:18px 24px;flex:1;min-width:170px"><div style="font-size:20px;color:#1e293b;font-weight:700">'+esc(x.title)+'</div><div style="font-size:46px;color:#6366f1;font-weight:800;margin-top:6px">'+d+'</div><div style="font-size:16px;color:#64748b">天后 · '+esc(x.date)+'</div></div>';
  }
  let nextHtml="";
  if(nextCourse){
    nextHtml='<div style="background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border-radius:14px;padding:22px 26px;margin-bottom:18px"><div style="font-size:17px;opacity:.92">'+(minsLeft>=0?"还有 "+minsLeft+" 分钟上课":"即将上课")+'</div><div style="font-size:38px;font-weight:800;margin-top:4px">下一节：'+esc(nextCourse)+'</div><div style="font-size:17px;opacity:.9;margin-top:2px">第'+(nextIdx+1)+'节 · '+esc(nextTime)+'</div></div>';
  }
  let html='<div style="font-size:15px;color:#64748b;margin-bottom:10px">今天是 '+wd[dayIdx]+'</div>';
  html+=nextHtml;
  html+='<div style="font-size:15px;color:#64748b;margin-bottom:8px">今日课程</div><div style="display:flex;flex-direction:column;gap:7px">'+rows+'</div>';
  if(cds.length){ html+='<div style="font-size:15px;color:#64748b;margin:20px 0 8px">倒计时</div><div style="display:flex;gap:12px;flex-wrap:wrap">'+cdHtml+'</div>'; }
  box.innerHTML=html;
}

async function viewAnnounce(cls){

  return `<div class="page-head"><div><div class="page-title">班级公告</div><div class="page-desc">班级通知、今日安排</div></div></div>
  <div class="card" id="ann_box" style="height:calc(100vh - 240px);min-height:380px;overflow:hidden"></div>`;

async function annRender(){
  let ann=[]; try{ ann=await fetchRows("announcements",{eq:{class_id:BIG.classId}}); }catch(e){}
  const content=(ann[0]&&ann[0].content)||"暂无公告";
  const box=$id("ann_box"); if(!box)return;
  if(box.dataset.content===content && $id("ann_inner")) return; // 内容没变，保留当前滚动不打断
  box.dataset.content=content;
  box.innerHTML=`<div id="ann_view" style="height:100%;overflow:hidden;position:relative;background:#fff;border-radius:10px"><div id="ann_inner" style="padding:20px 26px;white-space:pre-wrap;font-size:27px;line-height:2.1;color:#1e293b">${esc(content)}</div></div>`;
  if(window.__annInt)clearInterval(window.__annInt);
  const view=$id("ann_view"), inner=$id("ann_inner");
  const dis=inner.offsetHeight-view.clientHeight;
  if(dis<=0)return; // 内容能全部放下，不滚动
  inner.style.position="absolute"; inner.style.left="0"; inner.style.right="0"; inner.style.top="0";
  let y=0,pause=0;
  window.__annInt=setInterval(()=>{
    if(y<=-dis){ pause++; if(pause>55){ y=0; pause=0; } return; } // 滚到底停一下，回到顶部再循环
    y-=2; inner.style.transform=`translateY(${y}px)`;
  },30);
}

/* 到点语音播报公告 + 立即通知 */
let _lastPlayedTime="",_lastPlayedDate="";
function annSpeak(text,count){
  if(!("speechSynthesis" in window))return;
  try{ for(let i=0;i<count;i++){ const u=new SpeechSynthesisUtterance(text); u.lang="zh-CN"; u.rate=0.95; window.speechSynthesis.speak(u); } }catch(e){}
}
async function annCheckPlay(){
  if(typeof BIG==='undefined'||!BIG.classId)return;
  let ann=[]; try{ ann=await fetchRows("announcements",{eq:{class_id:BIG.classId}}); }catch(e){}
  const a=ann[0]; if(!a||!a.content)return;
  const now=new Date();
  const today=now.toDateString();
  const count=Math.max(1,parseInt(a.play_count,10)||1);
  // 立即通知：notify_at 已到 → 播报一次并清除
  if(a.notify_at){
    const na=new Date(a.notify_at).getTime();
    if(!isNaN(na)&&now.getTime()>=na){
      const onceKey="ann_notified_"+BIG.classId+"_"+a.id;
      if(localStorage.getItem(onceKey)!==a.notify_at){
        annSpeak(a.content,count);
        localStorage.setItem(onceKey,a.notify_at);
        try{ await updateRows("announcements",{id:a.id},{notify_at:null}); }catch(e){/* 大屏匿名无写权限时以本地标记兜底，避免重复播报 */}
      }
      return;
    }
  }
  if(!a.play_time)return;
  const hm=String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
  const times=(a.play_time||"").replace(/：/g,":").split(",").map(s=>s.trim()).filter(Boolean);
  if(!times.includes(hm))return;
  const once=(a.repeat==="once");
  if(once){
    const key="ann_once_"+BIG.classId;
    if(localStorage.getItem(key))return; // 已播过一次，不再播
  } else {
    if(_lastPlayedDate!==today){ _lastPlayedDate=today; _lastPlayedTime=""; }
    if(_lastPlayedTime===hm)return; // 当天该时间点已播
    _lastPlayedTime=hm;
  }
  if(once)localStorage.setItem("ann_once_"+BIG.classId,"1");
  annSpeak(a.content,once?count:1);
}

/* ===== 计时器（倒计时 + 正计时） ===== */
let timerS={mode:"cd",running:false,total:300,remain:300,elap:0,int:null};
function timerFmt(s){s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=s%60;return (h?String(h).padStart(2,"0")+":":"")+String(m).padStart(2,"0")+":"+String(ss).padStart(2,"0");}
function timerTick(){ if(timerS.mode==="cd"){ timerS.remain=Math.max(0,timerS.remain-1); const el=$id("timer_disp"); if(el)el.textContent=timerFmt(timerS.remain); if(timerS.remain<=0){ clearInterval(timerS.int); timerS.running=false; const d=$id("timer_disp"); if(d){d.textContent="00:00";d.style.color="var(--danger)";} const b=$id("timer_btn"); if(b)b.textContent="开始"; toast("倒计时结束！"); } } else { timerS.elap++; const el=$id("timer_disp"); if(el)el.textContent=timerFmt(timerS.elap); } }
function timerToggle(){ if(timerS.running){ timerPause(); } else { timerStart(); } }
function timerStart(){ if(timerS.running)return; if(timerS.mode==="cd"&&timerS.remain<=0){toast("倒计时已结束，请重置");return;} timerS.running=true; timerS.int=setInterval(timerTick,1000); const d=$id("timer_disp"); if(d)d.style.color=""; const b=$id("timer_btn"); if(b)b.textContent="暂停"; }
function timerPause(){ if(!timerS.running)return; clearInterval(timerS.int); timerS.running=false; const b=$id("timer_btn"); if(b)b.textContent="开始"; }
function timerReset(){ clearInterval(timerS.int); timerS.running=false; if(timerS.mode==="cd"){ const inp=$id("timer_min"); const m=parseInt(inp?inp.value:"",10)||5; timerS.total=Math.max(1,m*60); timerS.remain=timerS.total; } else { timerS.elap=0; } const d=$id("timer_disp"); if(d){d.textContent=timerFmt(timerS.mode==="cd"?timerS.remain:timerS.elap); d.style.color="";} const b=$id("timer_btn"); if(b)b.textContent="开始"; }
function timerSetMode(m){ clearInterval(timerS.int); timerS.running=false; timerS.mode=m; if(m==="cd"){ const inp=$id("timer_min"); const v=parseInt(inp?inp.value:"",10)||5; timerS.total=Math.max(1,v*60); timerS.remain=timerS.total; } else { timerS.elap=0; } const d=$id("timer_disp"); if(d){d.textContent=timerFmt(m==="cd"?timerS.remain:timerS.elap); d.style.color="";} const b=$id("timer_btn"); if(b)b.textContent="开始"; }
function viewTimer(){
  return `<div class="page-head"><div><div class="page-title">计时器</div><div class="page-desc">课堂倒计时 / 正计时</div></div></div>
  <div class="card" style="text-align:center;padding:32px">
    <div style="display:flex;gap:8px;justify-content:center;margin-bottom:20px">
      <button class="btn ${timerS.mode==="cd"?"btn-primary":"btn-ghost"}" onclick="timerSetMode('cd')">倒计时</button>
      <button class="btn ${timerS.mode==="st"?"btn-primary":"btn-ghost"}" onclick="timerSetMode('st')">正计时</button>
    </div>
    <div id="timer_disp" style="font-size:88px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:4px;line-height:1.1">${timerFmt(timerS.mode==="cd"?timerS.remain:timerS.elap)}</div>
    <div style="margin-top:20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      ${timerS.mode==="cd"?`<div style="display:flex;gap:6px;align-items:center"><input id="timer_min" type="number" min="1" max="120" value="${Math.max(1,Math.round(timerS.total/60))}" style="width:80px;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:18px;text-align:center"><span style="color:var(--muted)">分钟</span></div>`:""}
      <button id="timer_btn" class="btn btn-primary" onclick="timerToggle()">${timerS.running?"暂停":"开始"}</button>
      <button class="btn btn-danger" onclick="timerReset()">重置</button>
    </div>
  </div>`;
}

async function viewDashboard(cls){
  let ms=[],pts=[],groups=[],seat=null,sched=null; try{ ms=await fetchRows("members",{eq:{class_id:cls.id}}); pts=await fetchRows("points",{eq:{class_id:cls.id}}); groups=await fetchRows("groups",{eq:{class_id:cls.id}}); seat=await fetchOne("seat_plans",{class_id:cls.id}); sched=await fetchOne("schedules",{class_id:cls.id}); }catch(e){}
  const today=new Date(); const wd=["日","一","二","三","四","五","六"][today.getDay()];
  const sum={}; pts.forEach(p=>sum[p.member_id]=(sum[p.member_id]||0)+p.value);
  const rank=ms.map(m=>({m,t:sum[m.id]||0})).sort((a,b)=>b.t-a.t).slice(0,3);
  const assigned=seat&&seat.grid?seat.grid.flat().filter(Boolean).length:0;
  return `<div class="page-head"><div><div class="page-title">总览</div><div class="page-desc">${esc(cls.name)} · 今天周${wd} · ${today.getMonth()+1}月${today.getDate()}日</div></div></div>
  <div class="grid g4" style="margin-bottom:18px">
    <div class="stat"><div class="n">${ms.length}</div><div class="l">学生人数</div></div>
    <div class="stat"><div class="n">${groups.length}</div><div class="l">小组数</div></div>
    <div class="stat"><div class="n">${assigned}</div><div class="l">已排座位</div></div>
    <div class="stat"><div class="n">${pts.length}</div><div class="l">积分记录</div></div>
  </div>
  <div class="grid g2">
    <div class="card"><div class="card-title">积分 TOP3</div>${rank.length===0?'<div class="empty">暂无积分</div>':rank.map((x,i)=>`<div class="list-item"><span><span class="badge3 ${["b1","b2","b3"][i]}">${i+1}</span> <b>${esc(x.m.name)}</b></span><span style="font-weight:700;color:var(--ok)">${x.t>0?"+"+x.t:x.t}</span></div>`).join("")}</div>
    <div class="card"><div class="card-title">快捷查看</div><div class="grid g2">${[["students","学生管理"],["duty","值日分配"],["points","积分系统"],["homework","作业任务"]].map(([n,t])=>`<button class="btn btn-ghost" onclick="go('${n}')">${t}</button>`).join("")}<button class="btn btn-primary" onclick="randomPickB()">随机抽人</button></div></div>
  </div>`;
}

    ${ms.map(m=>`<tr data-k="${esc((m.name||"")+" "+(m.sid||""))}"><td>${esc(m.sid||"—")}</td><td><b>${esc(m.name)}</b></td><td>${esc(m.phone||"—")}</td></tr>`).join("")}

function filterStudents(){const q=($id("st_search").value||"").trim().toLowerCase();document.querySelectorAll("#st_body tr").forEach(r=>{r.style.display=q?(r.dataset.k.toLowerCase().includes(q)?"":"none"):"";});}
/* ===== 值日分配（只读展示） ===== */
function mondayOf(d){const x=new Date(d);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);x.setHours(0,0,0,0);return x;}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
const WEEK_DAY_CN=["一","二","三","四","五"];
function dutyWeekKey(){ if(BIG.dutyMode==="fixed")return "fixed"; return BIG.dutyWeek||fmtYMD(mondayOf(new Date())); }
function setDutyModeBig(m){ loadBig(); BIG.dutyMode=m; saveBig(); renderBig(); }
function setDutyWeekBig(w){ loadBig(); BIG.dutyWeek=w; saveBig(); renderBig(); }
async function viewDuty(cls){
  const mode=BIG.dutyMode==="fixed"?"fixed":"week";
  const week=dutyWeekKey();
  let ms=[],duty=[]; try{ ms=await fetchRows("members",{eq:{class_id:cls.id}}); duty=await fetchRows("duty",{eq:{class_id:cls.id,week_key:week}}); }catch(e){}
  const base=mode==="fixed"?new Date():new Date(week+"T00:00:00");
  const dayNames=WEEK_DAY_CN.map((d,i)=>mode==="fixed"?"每天固定":fmtYMD(addDays(base,i)));
  const sel=day=>{const r=duty.find(x=>x.day===day);return r&&r.member_ids?r.member_ids:[];};
  const weekBtns=mode==="week"?`<button class="btn btn-ghost btn-sm" onclick="setDutyWeekBig('${fmtYMD(addDays(base,-7))}')">上一周</button><button class="btn btn-ghost btn-sm" onclick="setDutyWeekBig('${fmtYMD(mondayOf(new Date()))}')">本周</button><button class="btn btn-ghost btn-sm" onclick="setDutyWeekBig('${fmtYMD(addDays(base,7))}')">下一周</button>`:"";
  return `<div class="page-head"><div><div class="page-title">值日分配</div><div class="page-desc">${mode==="fixed"?"固定值日 · 每天相同":"第 "+week+" 周 · 每周安排，可切周"} · 展示用</div></div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><div class="mode-tabs"><button class="mode-tab ${mode==="fixed"?"active":""}" onclick="setDutyModeBig('fixed')">固定</button><button class="mode-tab ${mode==="week"?"active":""}" onclick="setDutyModeBig('week')">每周</button></div>${weekBtns}</div></div>
  <div class="card">${ms.length===0?'<div class="empty">先到「学生管理」添加学生</div>':WEEK_DAY_CN.map((d,i)=>{
    const selIds=sel(i);
    const names=selIds.map(id=>{const m=ms.find(x=>x.id===id);return m?m.name:"";}).filter(Boolean);
    return `<div style="border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px">
      <div style="font-weight:600;margin-bottom:8px">周${d} ${dayNames[i]} <span style="font-size:12px;color:var(--muted);font-weight:400">（${names.length}人）</span></div>
      <div class="duty-cell">${names.length?names.map(n=>`<span class="chip brand" style="font-size:14px;padding:6px 14px">${esc(n)}</span>`).join(""):'<span style="color:var(--muted);font-size:13px">未安排</span>'}</div></div>`;
  }).join("")}</div>`;
}
/* ===== 小组分配（只读） ===== */
async function viewGroups(cls){

  gs=gs.sort((a,b)=>a.group_index-b.group_index);

  ${ms.length===0?'<div class="card"><div class="empty">先添加学生</div></div>':(gs.length===0?'<div class="card"><div class="empty">还没有分组，请在教师端设置</div></div>':`
  <div class="grid g3">${gs.map(g=>`<div class="card"><div class="card-title">第 ${g.group_index+1} 组 <span class="chip brand">${g.member_ids.length} 人</span></div>
    ${g.member_ids.map(mid=>{const m=ms.find(x=>x.id===mid);return m?`<div class="list-item"><span><span class="badge3 b1" style="width:20px;height:20px;font-size:11px">${esc(m.sid||"")}</span> <b>${esc(m.name)}</b></span></div>`:"";}).join("")}</div>`).join("")}</div>`)}`;

/* ===== 座位表（只读） ===== */
async function viewSeats(cls){
  let data=null; try{ data=await fetchOne("seat_plans",{class_id:cls.id}); }catch(e){}
  const grid=data&&data.grid?data.grid:[];
  let ms=[]; try{ ms=await fetchRows("members",{eq:{class_id:cls.id}}); }catch(e){}
  const flat=grid.flat().filter(Boolean);
  const colCount=grid.length?grid[0].length:0;
  const cellHtml=(r,c)=>{const mid=grid[r]?grid[r][c]:null;const m=mid?ms.find(x=>x.id===mid):null;
    return `<div class="seat-grid cell ${m?"filled":""}">${m?`<span>${esc(m.name)}</span><span style="font-size:11px;color:var(--brand-d)">${esc(m.sid||"")}</span>`:'<span style="color:#94a3b8">空</span>'}</div>`;};
  const colHeadHtml=(c)=>{const cnt=grid.reduce((a,row)=>a+((row[c])?1:0),0);return `<div class="col-head">第${c+1}组<span class="mini">${cnt}人</span></div>`;};
  return `<div class="page-head"><div><div class="page-title">座位表</div><div class="page-desc">当前座位安排 · 展示用，调整请在教师端操作</div></div></div>
  <div class="card">${!grid.length?'<div class="empty">还没有排座位</div>':`
    <div class="seat-grid" style="grid-template-columns:40px repeat(${colCount},1fr)"><div></div>${grid[0].map((_,c)=>colHeadHtml(c)).join("")}${grid.map((row,r)=>[`<div class="row-label">第${r+1}排</div>`,...row.map((_,c)=>cellHtml(r,c))].join("")).join("")}</div>
    <div style="margin-top:14px;font-size:12px;color:var(--muted)">已安排 ${flat.length} 人，未安排 ${ms.filter(m=>!flat.includes(m.id)).length} 人</div>`}</div>`;
}
/* ===== 成绩管理（可录入/修改） ===== */
const SUBJECTS=["语文","数学","英语","科学","道法","音乐","美术","体育","劳动","信息技术"];
async function viewScores(cls){
  const subject=BIG.scoreSubject||""; let ms=[],recs=[];
  try{ ms=await fetchRows("members",{eq:{class_id:cls.id}}); if(subject)recs=await fetchRows("scores",{eq:{class_id:cls.id,subject}}); }catch(e){}
  const map={}; recs.forEach(r=>map[r.member_id]=r.score);
  const rows=ms.map(m=>({m,score:map[m.id]})).filter(x=>x.score!=null&&x.score!=="");
  const avg=rows.length?(rows.reduce((a,x)=>a+Number(x.score),0)/rows.length).toFixed(1):"—";
  rows.sort((a,b)=>b.score-a.score);
  return `<div class="page-head"><div><div class="page-title">成绩管理</div><div class="page-desc">可录入成绩，期末使用</div></div>
    <button class="btn btn-primary btn-sm" onclick="saveScores()">保存本科成绩</button></div>
  <div class="card"><div class="card-title">科目设置</div>
    <div class="form-row"><div class="field" style="flex:1"><label>科目名称（可自由输入）</label><input id="sc_subject" value="${esc(subject)}" placeholder="如：数学 / 语文 / 英语"></div>
    <button class="btn btn-ghost btn-sm" onclick="pickSubject()">使用该科目</button><button class="btn btn-ghost btn-sm" onclick="clearSubject()">清空本科</button></div>
    <div class="subj-chips">${SUBJECTS.map(sj=>`<span class="subj-chip" onclick="setSubjectInput('${esc(sj)}')">${sj}</span>`).join("")}</div></div>
  <div class="grid g2">
    <div class="card"><div class="card-title">${esc(subject||"未选科目")} · 录入</div>${ms.length===0?'<div class="empty">还没有学生</div>':`<table class="tbl"><thead><tr><th>姓名</th><th>学号</th><th>分数</th></tr></thead><tbody>${ms.map(m=>`<tr><td><b>${esc(m.name)}</b></td><td>${esc(m.sid||"—")}</td><td><input type="number" min="0" max="150" step="0.5" class="mini-input" style="width:80px" data-sid="${esc(m.id)}" value="${map[m.id]!=null?esc(map[m.id]):""}"></td></tr>`).join("")}</tbody></table>`}</div>
    <div class="card"><div class="card-title">${esc(subject||"未选科目")} · 排名（平均 ${avg}）</div>${rows.length===0?'<div class="empty">录入后自动显示排名</div>':`<table class="tbl"><thead><tr><th>名次</th><th>姓名</th><th>分数</th></tr></thead><tbody>${rows.map((x,i)=>`<tr><td>${i<3?`<span class="badge3 ${["b1","b2","b3"][i]}">${i+1}</span>`:i+1}</td><td><b>${esc(x.m.name)}</b></td><td>${x.score}</td></tr>`).join("")}</tbody></table>`}</div>
  </div>`;
}
function setSubjectInput(v){ $id("sc_subject").value=v; }
function pickSubject(){ loadBig(); BIG.scoreSubject=$id("sc_subject").value.trim(); saveBig(); renderBig(); }
async function saveScores(){ const me=await requireWriter(); if(!me)return; const subject=($id("sc_subject")?$id("sc_subject").value.trim():BIG.scoreSubject.trim())||BIG.scoreSubject.trim(); if(!subject){toast("请先设置科目");return;} try{ const inputs=[...document.querySelectorAll("#main_area [data-sid]")]; await deleteRows("scores",{class_id:BIG.classId,subject}); const rows=[]; inputs.forEach(inp=>{const mid=inp.dataset.sid,val=inp.value.trim();if(val!=="")rows.push({class_id:BIG.classId,member_id:mid,subject,score:Number(val)});}); if(rows.length)await insertMany("scores",rows); renderBig(); toast("成绩已保存"); }catch(e){ toast("保存失败："+errMsg(e)); } }
async function clearSubject(){ const me=await requireWriter(); if(!me)return; const subject=BIG.scoreSubject.trim(); if(!subject){toast("请先设置科目");return;} if(!confirm("清空该科目所有成绩？"))return; try{ await deleteRows("scores",{class_id:BIG.classId,subject}); renderBig(); }catch(e){ toast("操作失败："+errMsg(e)); } }
/* ===== 课程表（只读） ===== */
const SUBJ_COLORS=["#2563eb","#16a34a","#d97706","#dc2626","#7c3aed","#0891b2","#db2777","#65a30d","#9333ea","#ea580c"];
function subjColor(sj){let h=0;for(const ch of sj)h=(h*31+ch.charCodeAt(0))>>>0;return SUBJ_COLORS[h%SUBJ_COLORS.length];}
async function viewSchedule(cls){
  let data=null; try{ data=await fetchOne("schedules",{class_id:cls.id}); }catch(e){}
  const days=5, periods=data?data.period_count:8, grid=data&&data.grid?data.grid:[];
  const wd=["周一","周二","周三","周四","周五"];
  return `<div class="page-head"><div><div class="page-title">课程表</div><div class="page-desc">当前课程安排 · 展示用，修改请在教师端操作</div></div></div>
  <div class="card">${!grid.length?'<div class="empty">还没有课程表</div>':`<div style="overflow-x:auto"><div class="sched-grid" style="grid-template-columns:56px repeat(${days},minmax(88px,1fr))">
    <div></div>${wd.map(d=>`<div style="font-weight:700;padding:8px;text-align:center;color:var(--muted)">${d}</div>`).join("")}
    ${grid.map((row,r)=>`<div style="display:contents"><div style="display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px">第${r+1}节</div>${row.map(cell=>`<div class="sched-grid cell ${cell?"filled":""}" style="${cell?`background:${subjColor(cell)}`:"font-size:13px"}">${cell?esc(cell):""}</div>`).join("")}</div>`).join("")}
  </div></div>`}</div>`;
}
/* ===== 积分系统（可记分） ===== */
let PICK_MS=[];
async function viewPoints(cls){
  let ms=[],pts=[],tpl=[]; try{ ms=await fetchRows("members",{eq:{class_id:cls.id}}); pts=await fetchRows("points",{eq:{class_id:cls.id}}); tpl=await fetchRows("point_templates",{eq:{class_id:cls.id}}); }catch(e){}
  PICK_MS=ms;
  pts=pts.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  const sum={}; pts.forEach(p=>{sum[p.member_id]=(sum[p.member_id]||0)+p.value;});
  const rank=ms.map(m=>({m,total:sum[m.id]||0})).sort((a,b)=>b.total-a.total);
  window._ptRank=rank;
  const fmt=t=>{const d=new Date(t);return (d.getMonth()+1)+"/"+d.getDate()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");};
  return `<div class="page-head"><div><div class="page-title">积分系统</div><div class="page-desc">按常用项记分，自动生成排行榜</div></div></div>
  <div class="grid g2">
    <div class="card"><div class="card-title">记分</div>
      <div class="field" style="margin-bottom:10px"><label>学生（输入学号或姓名搜索，点选）</label>
        <input id="pt_search" placeholder="搜索学号 / 姓名..." oninput="searchStudent()">
        <div id="pt_hits" style="margin-top:6px;display:flex;flex-wrap:wrap;gap:6px"></div>
        <input type="hidden" id="pt_mid">
      </div>
      <div class="form-row"><div class="field"><label>常用项</label><select id="pt_c" onchange="pickCat()"><option value="" data-v="">请选择</option>${tpl.map(t=>`<option value="${esc(t.name)}" data-v="${esc(t.value)}">${esc(t.name)}（${t.value>0?"+"+t.value:t.value}分）</option>`).join("")}</select></div>
        <div class="field"><label>分值（+加分/-扣分）</label><input id="pt_v" type="number" step="1"></div></div>
      <div class="form-row"><div class="field"><label>备注</label><input id="pt_n"></div></div>
      <button class="btn btn-primary btn-sm" onclick="addPoint()">记分</button>
      <div class="card-title" style="margin-top:16px">新增常用项（平时可自己添加）</div>
      <div class="form-row"><div class="field"><label>名称</label><input id="pc_name" placeholder="如：作业完成 / 迟到"></div><div class="field"><label>分值</label><input id="pc_value" type="number" step="1"></div><div style="display:flex;align-items:flex-end;padding-bottom:12px"><button class="btn btn-ghost btn-sm" onclick="addPointCat()">新增</button></div></div>
      ${tpl.length?`<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:6px">${tpl.map(t=>`<span class="chip gray">${esc(t.name)} ${t.value>0?"+"+t.value:t.value}分 <span style="cursor:pointer;color:var(--danger);margin-left:6px" onclick="delPointCat('${esc(t.id)}')">×</span></span>`).join("")}</div>`:""}
    </div>
    <div class="card"><div class="card-title">积分排行（全班 ${rank.length} 人）</div>${rank.length===0?'<div class="empty">还没有积分</div>':`<div style="max-height:420px;overflow:auto"><table class="tbl"><thead><tr><th>名次</th><th>姓名</th><th>总分</th></tr></thead><tbody>${rank.map((x,i)=>`<tr><td>${i<3?`<span class="badge3 ${["b1","b2","b3"][i]}">${i+1}</span>`:i+1}</td><td><b>${esc(x.m.name)}</b></td><td style="font-weight:700;color:${x.total>=0?"var(--ok)":"var(--danger)"}">${x.total>0?"+"+x.total:x.total}</td></tr>`).join("")}</tbody></table></div>`}</div>
  </div>
  <div class="card"><div class="card-title">积分明细（${pts.length}）</div>${pts.length===0?'<div class="empty">暂无记录</div>':`<table class="tbl"><thead><tr><th>时间</th><th>学生</th><th>类别</th><th>分值</th><th>备注</th><th></th></tr></thead><tbody>${pts.map(p=>{const m=ms.find(x=>x.id===p.member_id);return `<tr><td>${fmt(p.created_at)}</td><td>${m?esc(m.name):"?"}</td><td><span class="chip gray">${esc(p.cat)}</span></td><td style="font-weight:700;color:${p.value>=0?"var(--ok)":"var(--danger)"}">${p.value>0?"+"+p.value:p.value}</td><td>${esc(p.note||"")}</td><td><button class="btn btn-sm btn-danger" onclick="delPoint('${esc(p.id)}')">删</button></td></tr>`;}).join("")}</tbody></table>`}</div>`;
}
function searchStudent(){const q=($id("pt_search").value||"").trim().toLowerCase();const hits=PICK_MS.filter(m=>(m.name||"").toLowerCase().includes(q)||String(m.sid||"").includes(q)).slice(0,8);$id("pt_hits").innerHTML=q?hits.map(m=>`<span class="chip brand" style="cursor:pointer;font-size:13px" onclick="setPick('${esc(m.id)}','${esc(m.name)}','${esc(m.sid||"")}')">${esc(m.sid||"")} ${esc(m.name)}</span>`).join("")||'<span style="color:var(--muted);font-size:12px">无匹配</span>':"";}
function setPick(mid,name,sid){$id("pt_mid").value=mid;$id("pt_search").value=sid+" "+name;$id("pt_hits").innerHTML="";}
function pickCat(){const sel=$id("pt_c");const v=sel.selectedOptions[0]?sel.selectedOptions[0].dataset.v:"";if(v!==""){$id("pt_v").value=v;}else{$id("pt_v").value="";}}
async function addPoint(){ const me=await requireWriter(); if(!me)return; const mid=$id("pt_mid").value,v=parseFloat($id("pt_v").value),cat=$id("pt_c").value; if(!mid){toast("请先搜索并选择学生");return;} if(isNaN(v)){toast("请输入分值");return;} if(!cat){toast("请选择常用项或输入类别");return;} try{ await insertRow("points",{class_id:BIG.classId,member_id:mid,cat,value:v,note:$id("pt_n").value.trim()}); renderBig(); toast("已记分"); }catch(e){ toast("记分失败："+errMsg(e)); } }
async function addPointCat(){ const me=await requireWriter(); if(!me)return; const name=$id("pc_name").value.trim(),v=parseFloat($id("pc_value").value); if(!name){toast("请输入常用项名称");return;} if(isNaN(v)){toast("请输入分值");return;} try{ await insertRow("point_templates",{class_id:BIG.classId,name,value:v}); renderBig(); toast("已新增常用项"); }catch(e){ toast("新增失败："+errMsg(e)+"（需先建 point_templates 表）"); } }
async function delPointCat(id){ const me=await requireWriter(); if(!me)return; if(!confirm("删除该常用项？"))return; try{ await deleteRows("point_templates",{id}); renderBig(); }catch(e){ toast("删除失败："+errMsg(e)); } }
async function delPoint(id){ const me=await requireWriter(); if(!me)return; try{ await deleteRows("points",{id}); renderBig(); }catch(e){ toast("删除失败："+errMsg(e)); } }
/* ===== 作业任务（只读展示批改结果 + 扫码交作业） ===== */
async function viewHomework(cls){
  let hwAll=[],ms=[],subMap={};
  try{ hwAll=await fetchRows("homework",{eq:{class_id:cls.id}}); ms=await fetchRows("members",{eq:{class_id:cls.id}}); const rels=await fetchRows("class_user_rel",{eq:{class_id:cls.id}}); rels.forEach(r=>subMap[r.user_id]=r.subject||""); }catch(e){}
  ms=ms.sort((a,b)=>(a.sid||"").localeCompare(b.sid||"",undefined,{numeric:true}));
  hwAll=hwAll.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).map(h=>Object.assign({},h,{subj:subMap[h.create_teacher_id]||"未设科目"}));
  const subList=[...new Set(hwAll.map(h=>h.subj))];
  let shown=BIG.subj?hwAll.filter(h=>h.subj===BIG.subj):hwAll;
  if(BIG.subj&&!shown.length&&hwAll.length){ BIG.subj=""; shown=hwAll; saveBig(); }
  if(shown.length&&(!BIG.hwId||!shown.some(h=>h.id===BIG.hwId))){ BIG.hwId=shown[0].id; saveBig(); }
  const curHw=shown.find(h=>h.id===BIG.hwId)||null;
  let subs=[]; if(BIG.hwId){ try{ subs=await fetchRows("hw_submit",{eq:{hw_id:BIG.hwId}}); }catch(e){} }
  bigCache={ms,subs,hwId:BIG.hwId};
  const arr=ms.map(m=>{const s=subs.find(x=>x.student_id===m.id);return {m,sub:s};});
  const total=arr.length, submitted=arr.filter(x=>x.sub&&x.sub.submit_status==="已提交").length, unsub=total-submitted;
  const graded=arr.filter(x=>x.sub&&x.sub.submit_status==="已提交"&&x.sub.grade&&x.sub.grade!=="未批改").length, pending=submitted-graded;
  const gCount=g=>arr.filter(x=>x.sub&&x.sub.grade===g).length;
  const gradeCls={"优+":"g-sub","优":"g-ok","良":"g-good","及格":"g-pass","待及格":"g-fail","未批改":"g-none"};
  return `<div class="page-head"><div><div class="page-title">作业任务</div><div class="page-desc">展示教师批改结果 · 扫码上交 · 展示用</div></div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      ${subList.length>1?`<select style="padding:8px 10px;border:1px solid var(--line);border-radius:8px" onchange="switchSubj(this.value)"><option value="" ${!BIG.subj?"selected":""}>全部科目</option>${subList.map(s=>`<option value="${esc(s)}" ${BIG.subj===s?"selected":""}>${esc(s)}</option>`).join("")}</select>`:""}
      <select id="big_hw" onchange="switchHw(this.value)" style="padding:8px 10px;border:1px solid var(--line);border-radius:8px;min-width:220px">${shown.length?shown.map(h=>`<option value="${esc(h.id)}" ${h.id===BIG.hwId?"selected":""}>[${esc(h.subj)}] ${esc(h.title)}</option>`).join(""):'<option value="">暂无作业</option>'}</select>
    </div></div>
  ${!curHw?'<div class="card"><div class="empty">该班级还没有作业，请在教师端布置</div></div>':`
  <div class="grid g2">
    <div class="card"><div class="card-title">${esc(curHw.title)} · 提交统计</div>
      <div class="grid g3">${[["总人数",total,""],["已交",submitted,"var(--ok)"],["未交",unsub,"var(--danger)"]].map((x,i)=>`<div class="stat"><div class="n" id="${i===1?"big_stat_sub":i===2?"big_stat_unsub":""}" style="color:${x[2]||'var(--brand)'}">${x[1]}</div><div class="l">${x[0]}</div></div>`).join("")}</div>
      <div style="margin-top:12px;font-size:13px;font-weight:700;color:var(--brand)">教师批改</div>
      <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap"><div class="stat" style="flex:1;min-width:90px;background:var(--brand-l);border-radius:8px;padding:8px 12px"><div class="n" id="big_stat_graded" style="color:var(--brand)">${graded}</div><div class="l">已批改（人）</div></div><div class="stat" style="flex:1;min-width:90px;background:var(--danger-l);border-radius:8px;padding:8px 12px"><div class="n" id="big_stat_pending" style="color:var(--danger)">${pending}</div><div class="l">待批改（人，已交未批改）</div></div></div>
      <div class="grid g5" style="margin-top:10px">${["优+","优","良","及格","待及格"].map(g=>`<div class="stat" data-g="${g}"><div class="n" style="font-size:20px">${gCount(g)}</div><div class="l">${g}</div></div>`).join("")}</div></div>
    <div class="card"><div class="card-title">扫码交作业</div>
      <div style="border:2px solid var(--brand);border-radius:12px;padding:14px;display:flex;align-items:center;gap:12px">
        <input id="big_scan" placeholder="扫学生条码 / 学号，回车标记已交" autofocus onkeydown="handleBigScan(event)" style="flex:1;padding:12px 14px;font-size:20px;border:1px solid var(--line);border-radius:10px;text-align:center;letter-spacing:2px">

      <div id="big_scan_result" style="margin-top:10px"></div></div>
  </div>
  <div class="card"><div class="card-title">学生作业名单（${total} 人）</div>
    <div class="toolbar"><input id="hw_search" placeholder="搜索学生姓名/学号..." style="min-width:180px" oninput="filterHw()">
    <button id="hw_btn_unsub" class="btn ${hwOnlyUnsub?'btn-primary':'btn-ghost'} btn-sm" onclick="toggleHwUnsub()">${hwOnlyUnsub?'显示全部':'只看未上交'}</button>

      <td>${esc(x.m.sid||"—")}</td><td><b>${esc(x.m.name)}</b></td>
      <td>${s?`<span class="chip ${s.submit_status==="已提交"?"ok":"warn"}">${s.submit_status==="已提交"?"已交":"未交"}</span>`:'<span class="chip warn">未交</span>'}</td>
      <td>${s?`<span class="hw-grade-badge ${gradeCls[s.grade]||"g-none"}">${esc(s.grade)}</span>`:'<span class="hw-grade-badge g-none">未批改</span>'}</td>
      <td>${s&&s.submit_status==="已提交"?(s.is_return==="是"?'<span class="chip" style="background:var(--danger-l);color:var(--danger)">退回</span>':'否'):''}</td>
    </tr>`;}).join("")}
    </tbody></table></div></div>`}`;
}
function filterHw(){const q=($id("hw_search").value||"").trim().toLowerCase();document.querySelectorAll("#hw_body tr").forEach(r=>{let show=true;if(hwOnlyUnsub&&r.dataset.u==="0")show=false;if(hwOnlyPending&&r.dataset.p==="0")show=false;if(show&&q&&!r.dataset.k.toLowerCase().includes(q))show=false;r.style.display=show?"":"none";});}
let hwOnlyUnsub=false,hwOnlyPending=false;
function updateHwBtns(){const u=$id("hw_btn_unsub"),p=$id("hw_btn_pending");if(u){u.textContent=hwOnlyUnsub?"显示全部":"只看未上交";u.className=`btn ${hwOnlyUnsub?"btn-primary":"btn-ghost"} btn-sm`;}if(p){p.textContent=hwOnlyPending?"显示全部":"只看未批改";p.className=`btn ${hwOnlyPending?"btn-primary":"btn-ghost"} btn-sm`;}}
function toggleHwUnsub(){if(!hwOnlyUnsub){hwOnlyUnsub=true;hwOnlyPending=false;}else{hwOnlyUnsub=false;}filterHw();updateHwBtns();}
function toggleHwPending(){if(!hwOnlyPending){hwOnlyPending=true;hwOnlyUnsub=false;}else{hwOnlyPending=false;}filterHw();updateHwBtns();}
function switchHw(v){ loadBig(); BIG.hwId=v; saveBig(); renderBig(); }
function switchSubj(v){ loadBig(); BIG.subj=v; BIG.hwId=null; saveBig(); renderBig(); }
async function findMemberBySid(cid,sid){
  const norm=s=>s.replace(/^0+/,"")||"0";
  const target=norm(sid);
  if(bigCache.ms&&bigCache.ms.length){ const m=bigCache.ms.find(x=>norm(x.sid||"")===target); if(m)return m; }
  const trySids=[]; trySids.push(sid);
  const num=sid.replace(/^0+/,""); if(num&&num!==sid)trySids.push(num);
  const padded=String(parseInt(sid,10)||0).padStart(4,"0"); if(padded!==sid)trySids.push(padded);
  for(const s of trySids){ const m=await fetchOne("members",{class_id:cid,sid:s}); if(m){ bigCache.ms.push(m); return m; } }
  return null;
}
async function handleBigScan(e){
  if(e.key!=="Enter")return;
  const me=await requireWriter(); if(!me)return;
  const sid=$id("big_scan").value.trim(); $id("big_scan").value="";
  if(!sid||!BIG.hwId){ if(!BIG.hwId)toast("当前没有作业"); return; }
  try{
    const stu=await findMemberBySid(BIG.classId,sid);
    if(!stu){toast("未找到学号 "+sid);return;}
    let sub=bigCache.subs.find(x=>x.student_id===stu.id);
    if(sub){ await updateRows("hw_submit",{id:sub.id},{submit_status:"已提交",submit_at:new Date().toISOString()}); sub.submit_status="已提交"; }
    else { const rec={hw_id:BIG.hwId,student_id:stu.id,submit_status:"已提交",grade:"未批改",is_return:"否",submit_at:new Date().toISOString()}; await insertRow("hw_submit",rec); sub=Object.assign({id:"tmp"},rec); bigCache.subs.push(sub); }
    const subEl=$id("big_stat_sub"), unsubEl=$id("big_stat_unsub");
    if(subEl&&unsubEl){ subEl.textContent=String((parseInt(subEl.textContent)||0)+1); unsubEl.textContent=String(Math.max(0,(parseInt(unsubEl.textContent)||0)-1)); }
    const row=document.querySelector('#hw_body tr[data-mid="'+stu.id+'"]');
    if(row){ const c=row.querySelector("td:nth-child(3)"),g=row.querySelector("td:nth-child(4)"); if(c)c.innerHTML='<span class="chip ok">已交</span>'; if(g)g.innerHTML='<span class="hw-grade-badge g-none">未批改</span>'; row.dataset.u="0"; }
    const area=$id("big_scan_result");
    if(area){area.innerHTML=`<div style="border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--bg)">
      <div><div style="font-size:12px;color:var(--muted)">学生条码</div><div style="font-size:18px;font-weight:700">${esc(stu.sid||"—")}</div></div>
      <div><div style="font-size:12px;color:var(--muted)">学生</div><div style="font-size:18px;font-weight:700">${esc(stu.name)}</div></div>
      <div><div style="font-size:12px;color:var(--muted)">上交状态</div><div style="font-size:16px;font-weight:700;color:var(--ok)">已提交</div></div>
      <div><div style="font-size:12px;color:var(--muted)">评定等级</div><div style="font-size:16px;font-weight:700">待批改</div></div>
    </div>`;}
    const sc=$id("big_scan"); if(sc)sc.focus();
  }catch(err){ toast("操作失败："+errMsg(err)); }
}
async function handleBigGradeScan(e){
  const gradeCls={"优+":"g-sub","优":"g-ok","良":"g-good","及格":"g-pass","待及格":"g-fail","未批改":"g-none"};
  if(e.key!=="Enter")return;
  const me=await requireWriter(); if(!me)return;
  const sid=$id("big_grade_scan").value.trim(); $id("big_grade_scan").value="";
  if(!sid||!BIG.hwId){ if(!BIG.hwId)toast("当前没有作业"); return; }
  try{
    const stu=await findMemberBySid(BIG.classId,sid);
    if(!stu){toast("未找到学号 "+sid);return;}
    const sub=bigCache.subs.find(x=>x.student_id===stu.id);
    const cur=(sub&&sub.grade&&sub.grade!=="未批改")?sub.grade:"未批改";
    const area=$id("big_grade_area"); if(!area)return;

    area.innerHTML=`<div style="font-size:15px">正在批改：<b>${esc(stu.name)}</b> <span style="color:var(--muted);font-size:13px">${esc(stu.sid||"")}</span> 当前等级 <span class="hw-grade-badge ${grCls}">${esc(cur)}</span></div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px">${["优+","优","良","及格","待及格"].map(g=>`<button class="btn ${cur===g?"btn-primary":"btn-ghost"}" style="min-width:64px" onclick="bigGrade('${esc(stu.id)}','${g}')">${g}</button>`).join("")}<button class="btn btn-danger" style="min-width:64px" onclick="bigGrade('${esc(stu.id)}','退回')">退回作业</button></div>`;
  }catch(err){ toast("操作失败："+errMsg(err)); }
}
async function bigGrade(mid,g){
  const me=await requireWriter(); if(!me)return;
  try{
    const grade=g==="退回"?"未批改":g, isReturn=g==="退回"?"是":"否";
    let sub=bigCache.subs.find(x=>x.student_id===mid);
    const oldGrade=sub?sub.grade:null;
    if(sub){ await updateRows("hw_submit",{id:sub.id},{grade,is_return:isReturn}); sub.grade=grade; sub.is_return=isReturn; }
    else { const rec={hw_id:BIG.hwId,student_id:mid,submit_status:"已提交",grade,is_return:isReturn,submit_at:new Date().toISOString()}; await insertRow("hw_submit",rec); sub=Object.assign({id:"tmp"},rec); bigCache.subs.push(sub); }
    const grEl=$id("big_stat_graded"), pdEl=$id("big_stat_pending");
    if(grEl&&pdEl){ const wasGraded=oldGrade&&oldGrade!=="未批改"; const nowGraded=grade!=="未批改"; if(!wasGraded&&nowGraded){grEl.textContent=String((parseInt(grEl.textContent)||0)+1);pdEl.textContent=String(Math.max(0,(parseInt(pdEl.textContent)||0)-1));} if(wasGraded&&!nowGraded){pdEl.textContent=String((parseInt(pdEl.textContent)||0)+1);grEl.textContent=String(Math.max(0,(parseInt(grEl.textContent)||0)-1));} }
    const gradeClsMap={"优+":"g-sub","优":"g-ok","良":"g-good","及格":"g-pass","待及格":"g-fail","未批改":"g-none"};
    if(oldGrade&&["优+","优","良","及格","待及格"].includes(oldGrade)){ const og=document.querySelector('#main_area .stat[data-g="'+oldGrade+'"] .n'); if(og)og.textContent=String(Math.max(0,(parseInt(og.textContent)||0)-1)); }
    if(["优+","优","良","及格","待及格"].includes(grade)){ const ng=document.querySelector('#main_area .stat[data-g="'+grade+'"] .n'); if(ng)ng.textContent=String((parseInt(ng.textContent)||0)+1); }
    const row=document.querySelector('#hw_body tr[data-mid="'+mid+'"]');
    if(row){ const gtd=row.querySelector("td:nth-child(4)"); if(gtd)gtd.innerHTML='<span class="hw-grade-badge '+(gradeClsMap[grade]||"g-none")+'">'+esc(grade)+'</span>'; const rtd=row.querySelector("td:nth-child(5)"); if(rtd)rtd.innerHTML=isReturn==="是"?'<span class="chip" style="background:var(--danger-l);color:var(--danger)">退回</span>':'<span class="chip gray">—</span>'; }
    toast(g==="退回"?"已退回作业":"已批改："+g);
    const sc=$id("big_grade_scan"); if(sc)sc.focus();
  }catch(err){ toast("批改失败："+errMsg(err)); }
}

async function pickRandom(){
  const n=Math.max(1,parseInt($id("pick_n")?$id("pick_n").value:"1",10)||1);
  let ms=[]; try{ ms=await fetchRows("members",{eq:{class_id:BIG.classId}}); }catch(e){}
  if(!ms.length){toast("还没有学生");return;}
  const pool=[...ms]; const picked=[];
  for(let i=0;i<Math.min(n,pool.length);i++){ picked.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]); }
  $id("pick_disp").innerHTML=`<div class="grid g3">${picked.map(m=>`<div class="card" style="text-align:center;padding:18px 10px"><div style="font-size:34px;font-weight:800">${esc(m.name)}</div><div style="color:var(--muted);font-size:14px;margin:4px 0 10px">学号 ${esc(m.sid||"")}</div><div style="display:flex;gap:5px;flex-wrap:wrap;justify-content:center">${["+1","+2","+3","-1","-2"].map(l=>`<button class="btn btn-sm ${l.startsWith("-")?"btn-danger":"btn-ok"}" onclick="quickPoint('${esc(m.id)}',${l})">${l}</button>`).join("")}</div></div>`).join("")}</div>`;
}
async function quickPoint(mid,v){
  const me=await requireWriter(); if(!me)return;
  if(!mid){toast("请先随机点名");return;}
  try{ await insertRow("points",{class_id:BIG.classId,member_id:mid,cat:"随机点名",value:v,note:"",created_at:new Date().toISOString().slice(0,10)}); toast((v>0?"+":"")+v+" 分"); }catch(e){ toast("记分失败："+errMsg(e)); }
}
/* ===== 桌面悬浮加分球（仅 exe 生效，网页版自动跳过） ===== */
(function(){ if(!window.electronAPI) return;
  // 悬浮球点加分 → 给当前选中学生记分
  window.electronAPI.onAddPoint(function(p){ if(!p||!p.mid){toast("请先在悬浮球点名或搜索学生");return;} quickPoint(p.mid,p.v); });
  // 悬浮球请求随机抽人（可带人数）→ 主窗口抽人并回传
  window.electronAPI.onRollRequest(async function(cnt){
    if(!BIG.classId){toast("请先在大屏选择班级");return;}
    const ms=await fetchRows("members",{eq:{class_id:BIG.classId}}); if(!ms.length){toast("还没有学生");return;}
    const n=Math.min(Math.max(1,parseInt(cnt,10)||1),ms.length);
    const pool=ms.slice(), out=[];
    for(let i=0;i<n;i++){ const k=Math.floor(Math.random()*pool.length); out.push(pool.splice(k,1)[0]); }
    window.electronAPI.sendRoll(out.map(p=>({mid:p.id,name:p.name,sid:p.sid||""})));
  });
  // 悬浮球搜索学号/姓名 → 主窗口搜人并回传
  window.electronAPI.onSearchRequest(async function(q){ if(!BIG.classId) return; const ms=await fetchRows("members",{eq:{class_id:BIG.classId}}); const qq=String(q||"").trim(); const arr=qq?ms.filter(m=>(m.sid||"").includes(qq)||(m.name||"").includes(qq)).slice(0,8).map(m=>({mid:m.id,name:m.name,sid:m.sid||""})):[]; window.electronAPI.sendSearch(arr); });
})();

/* ===== 表现登记（当天好/差，可整批统一加减分） ===== */
let PERF={good:new Set(),bad:new Set()};
let PERF_MIDS=[];
function perfToday(){ const d=new Date(),p=n=>String(n).padStart(2,"0"); return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); }
function perfToggle(mid,v){
  if(v==="good"){ if(PERF.good.has(mid)){PERF.good.delete(mid);} else {PERF.good.add(mid);PERF.bad.delete(mid);} }
  else { if(PERF.bad.has(mid)){PERF.bad.delete(mid);} else {PERF.bad.add(mid);PERF.good.delete(mid);} }
  perfPaint(mid); perfCount();
}
function perfPaint(mid){
  const g=document.getElementById("pf_g_"+mid), b=document.getElementById("pf_b_"+mid);
  const on=PERF.good.has(mid), on2=PERF.bad.has(mid);
  if(g){ g.style.background=on?"#16a34a":"#fff"; g.style.color=on?"#fff":"#334155"; g.style.borderColor=on?"#16a34a":"#d7dee8"; }
  if(b){ b.style.background=on2?"#dc2626":"#fff"; b.style.color=on2?"#fff":"#334155"; b.style.borderColor=on2?"#dc2626":"#d7dee8"; }
}
function perfCount(){
  const g=document.getElementById("pf_cnt_g"), b=document.getElementById("pf_cnt_b");
  if(g)g.textContent=PERF.good.size; if(b)b.textContent=PERF.bad.size;
}
let PERF_LIST=[];
function perfFind(key){
  const k=String(key||"").trim(); if(!k)return null;
  const norm=s=>{const t=String(s||"").replace(/^0+/,"");return t||"0";};
  const nk=norm(k);
  return PERF_LIST.find(m=>norm(m.sid)===nk)
      || PERF_LIST.find(m=>(m.sid||"")===k)
      || PERF_LIST.find(m=>(m.name||"").includes(k))
      || null;
}
function perfScan(kind,inpId){
  const el=document.getElementById(inpId);
  const hit=perfFind(el&&el.value);
  if(!hit){ toast("没找到该学号 / 姓名"); if(el){el.value="";el.focus();} return; }
  const mid=hit.id;
  const was=kind==="good"?PERF.good.has(mid):PERF.bad.has(mid);
  if(was){ PERF.good.delete(mid); PERF.bad.delete(mid); }
  else if(kind==="good"){ PERF.good.add(mid); PERF.bad.delete(mid); }
  else { PERF.bad.add(mid); PERF.good.delete(mid); }
  perfPaint(mid); perfCount();
  const card=document.getElementById("pf_c_"+mid);
  if(card){ try{ card.scrollIntoView({block:"center",behavior:"smooth"}); }catch(e){} }
  toast(hit.name+" "+(hit.sid||"")+" "+(was?"已取消":(kind==="good"?"记为表现好":"记为表现差")));
  if(el){ el.value=""; el.focus(); }
}
function perfSelectAll(v){ PERF={good:new Set(),bad:new Set()}; PERF_MIDS.forEach(m=>{ if(v==="good")PERF.good.add(m); else PERF.bad.add(m); }); PERF_MIDS.forEach(m=>perfPaint(m)); perfCount(); }
function perfClearSel(){ PERF={good:new Set(),bad:new Set()}; PERF_MIDS.forEach(m=>perfPaint(m)); perfCount(); }
async function perfCommit(classId){
  classId=classId||BIG.classId;
  const vgEl=document.getElementById("pf_vg"), vbEl=document.getElementById("pf_vb");
  const vg=Math.abs(parseFloat(vgEl&&vgEl.value)||2)||2;
  const vb=Math.abs(parseFloat(vbEl&&vbEl.value)||1)||1;
  const today=perfToday(); const rows=[];
  PERF.good.forEach(mid=>rows.push({class_id:classId,member_id:mid,cat:"表现好",value:vg,note:"",created_at:today}));
  PERF.bad.forEach(mid=>rows.push({class_id:classId,member_id:mid,cat:"表现差",value:-vb,note:"",created_at:today}));
  if(!rows.length){toast("请先选学生（可点“全选表现好/差”）");return;}
  const ng=PERF.good.size, nb=PERF.bad.size;
  try{
    const {error}=await sb.from("points").insert(rows); if(error)throw error;
    toast("已登记 "+(ng+nb)+" 人次（好 "+ng+" · 差 "+nb+"）");
    PERF={good:new Set(),bad:new Set()}; renderBig();
  }catch(e){ toast("登记失败："+errMsg(e)); }
}
async function perfCommitB(){ const me=await requireWriter(); if(!me)return; await perfCommit(BIG.classId); }
async function viewPerfB(cls){

  ms=ms.slice().sort((a,b)=>(a.sid||"").localeCompare(b.sid||"",undefined,{numeric:true}));
  PERF_MIDS=ms.map(m=>m.id); PERF_LIST=ms.map(m=>({id:m.id,name:m.name,sid:m.sid||""})); PERF={good:new Set(),bad:new Set()};
  const goodN=tp.filter(p=>p.cat==="表现好").length, badN=tp.filter(p=>p.cat==="表现差").length;
  const detail=tp.slice().sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)));
  return `<div class="page-head"><div><div class="page-title">表现登记</div><div class="page-desc">${today} · 只统计当天，次日自动清空；选好后可统一加分 / 扣分</div></div></div>
  <div class="card"><div class="card-title">今日登记 <span style="font-weight:400;font-size:14px;color:#64748b">已选：好 <b id="pf_cnt_g" style="color:#16a34a">0</b> 人 · 差 <b id="pf_cnt_b" style="color:#dc2626">0</b> 人</span></div>
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:#f7f9fc;border-radius:12px;padding:16px;margin-bottom:18px">
      <button class="btn btn-sm" onclick="perfSelectAll('good')" style="height:50px;padding:0 20px;font-size:16px">全选表现好</button>
      <button class="btn btn-sm" onclick="perfSelectAll('bad')" style="height:50px;padding:0 20px;font-size:16px">全选表现差</button>
      <button class="btn btn-ghost btn-sm" onclick="perfClearSel()" style="height:50px;padding:0 20px;font-size:16px">清空选择</button>
      <input id="pf_sg" placeholder="刷 / 输学号 → 记好" onkeydown="if(event.key==='Enter')perfScan('good','pf_sg')" style="width:265px;height:50px;font-size:17px;padding:0 14px;border:1px solid #bbf7d0;border-radius:10px;background:#f0fdf4">
      <input id="pf_sb" placeholder="刷 / 输学号 → 记差" onkeydown="if(event.key==='Enter')perfScan('bad','pf_sb')" style="width:265px;height:50px;font-size:17px;padding:0 14px;border:1px solid #fecaca;border-radius:10px;background:#fef2f2">
      <span style="font-size:16px;color:#475569">好 每人 +</span>
      <input id="pf_vg" type="number" min="1" value="2" style="width:96px;height:50px;font-size:22px;text-align:center;border:1px solid #d7dee8;border-radius:10px">
      <span style="font-size:16px;color:#475569">差 每人 −</span>
      <input id="pf_vb" type="number" min="1" value="1" style="width:96px;height:50px;font-size:22px;text-align:center;border:1px solid #d7dee8;border-radius:10px">
      <button class="btn btn-primary" onclick="perfCommitB()" style="height:52px;padding:0 30px;font-size:17px">提交登记</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px">
      ${ms.map(m=>`<div id="pf_c_${m.id}" style="border:1px solid #e2e8f0;border-radius:12px;padding:12px;background:#fff">
        <div style="font-weight:700;font-size:17px;margin-bottom:10px">${esc(m.name)}<span style="color:#94a3b8;font-weight:400;font-size:13px;margin-left:7px">${esc(m.sid||"")}</span></div>
        <div style="display:flex;gap:8px">
          <button id="pf_g_${m.id}" class="btn btn-sm" style="flex:1;height:44px;font-size:16px;background:#fff;color:#334155;border:1px solid #d7dee8;border-radius:9px" onclick="perfToggle('${m.id}','good')">好${gcnt[m.id]?" ×"+gcnt[m.id]:""}</button>
          <button id="pf_b_${m.id}" class="btn btn-sm" style="flex:1;height:44px;font-size:16px;background:#fff;color:#334155;border:1px solid #d7dee8;border-radius:9px" onclick="perfToggle('${m.id}','bad')">差${bcnt[m.id]?" ×"+bcnt[m.id]:""}</button>
        </div>
      </div>`).join("")}
    </div>
  </div>
  <div class="card"><div class="card-title">今日明细（好 ${goodN} 人次 · 差 ${badN} 人次）</div>
    ${detail.length===0?'<div class="empty">今天还没有登记</div>':`<table class="tbl"><thead><tr><th>日期</th><th>学生</th><th>类别</th><th>分值</th><th>撤销</th></tr></thead><tbody>${detail.map(p=>{const mm=ms.find(x=>x.id===p.member_id);return `<tr><td>${String(p.created_at||"").slice(0,10)}</td><td>${mm?esc(mm.name):"?"}</td><td><span class="chip ${p.cat==="表现好"?"brand":"danger"}">${esc(p.cat)}</span></td><td style="font-weight:700;color:${p.value>=0?"var(--ok)":"var(--danger)"}">${p.value>0?"+"+p.value:p.value}</td><td><button class="btn btn-sm btn-danger" onclick="perfUndoB('${esc(p.id)}')">撤销</button></td></tr>`;}).join("")}</tbody></table>`}
  </div>`;
}
async function perfUndoB(id){ const me=await requireWriter(); if(!me)return; try{ await deleteRows("points",{id}); renderBig(); toast("已撤销"); }catch(e){ toast("撤销失败："+errMsg(e)); } }

/* ===== 积分商城 ===== */
async function viewShop(cls){
  let ms=[],items=[],red=[]; try{ ms=await fetchRows("members",{eq:{class_id:cls.id}}); items=await fetchRows("shop_items",{eq:{class_id:cls.id}}); red=await fetchRows("redemptions",{eq:{class_id:cls.id}}); }catch(e){}
  const sum={}; try{ const pts=await fetchRows("points",{eq:{class_id:cls.id}}); pts.forEach(p=>sum[p.member_id]=(sum[p.member_id]||0)+p.value); }catch(e){}
  return `<div class="page-head"><div><div class="page-title">积分商城</div><div class="page-desc">查看奖品与兑换</div></div></div>
  <div class="card"><div class="card-title">选择学生兑换</div>
    <label class="lab">学号 / 姓名（可扫码）</label>
    <input class="inp" id="sh_key" placeholder="输学号或姓名后回车" onkeydown="if(event.key==='Enter')shPick()">
    <div id="sh_stu" style="margin-top:10px"></div>
    <div style="margin-top:12px" id="sh_list">${items.length===0?'<div class="empty">暂无奖品，请先在教师端添加</div>':items.map(i=>`<div class="list-item" style="justify-content:space-between"><span><b>${esc(i.name)}</b>　<span style="color:var(--muted)">${i.cost} 积分${i.stock==null?"":" · 余 "+(i.stock-red.filter(r=>r.item_id===i.id).length)}</span></span><button class="btn btn-sm btn-primary" onclick="shRedeem('${esc(i.id)}','${esc(i.name)}',${i.cost})">兑换</button></div>`).join("")}</div>
  </div>
  <div class="card"><div class="card-title">兑换记录</div>
    ${red.length===0?'<div class="empty">暂无记录</div>':`<table class="tbl"><thead><tr><th>学生</th><th>奖品</th><th>积分</th><th>时间</th></tr></thead><tbody>${red.map(r=>{const m=ms.find(x=>x.id===r.member_id);return `<tr><td>${m?esc(m.name):"?"}</td><td>${esc(r.item_name)}</td><td>${r.cost}</td><td>${(r.created_at||"").slice(0,10)}</td></tr>`;}).join("")}</tbody></table>`}
  </div>`;
}
let _shMid="";
async function shPick(){
  const key=($id("sh_key").value||"").trim(); if(!key){toast("请输入学号或姓名");return;}
  let ms=[]; try{ ms=await fetchRows("members",{eq:{class_id:BIG.classId}}); }catch(e){}
  const m=ms.find(x=>(x.sid||"")===key)||ms.find(x=>(x.name||"")===key);
  if(!m){toast("未找到学生");$id("sh_stu").innerHTML="";return;}
  _shMid=m.id; $id("sh_stu").innerHTML=`<span class="chip brand">${esc(m.name)}　学号 ${esc(m.sid||"")}</span>`;
}
async function shRedeem(itemId,itemName,cost){
  const me=await requireWriter(); if(!me)return;
  if(!_shMid){toast("先选择学生");return;}
  const sum={}; try{ const pts=await fetchRows("points",{eq:{class_id:BIG.classId}}); pts.forEach(p=>sum[p.member_id]=(sum[p.member_id]||0)+p.value); }catch(e){}
  if((sum[_shMid]||0)<cost){toast("该生积分不足");return;}
  const item=await fetchOne("shop_items",{id:itemId});
  const used=item.stock==null?0:((await fetchRows("redemptions",{eq:{class_id:BIG.classId,item_id:itemId}})).length);
  if(item.stock!=null&&used>=item.stock){toast("奖品已兑完");return;}
  try{ await insertRow("redemptions",{class_id:BIG.classId,member_id:_shMid,item_id:itemId,item_name:itemName,cost}); await insertRow("points",{class_id:BIG.classId,member_id:_shMid,cat:"兑换:"+itemName,value:-cost,note:"",created_at:new Date().toISOString().slice(0,10)}); renderBig(); toast("已兑换"+itemName); }catch(e){ toast("兑换失败："+errMsg(e)); }
}

/* ===== 请假 / 缺勤（批量登记） ===== */
async function viewLeave(cls){
  const today=new Date().toISOString().slice(0,10);
  setTimeout(()=>{ if($id("lv_list"))lvRenderList(); },60);
  return `<div class="page-head"><div><div class="page-title">请假 / 缺勤</div><div class="page-desc">批量登记，按日期查看</div></div></div>
  <div class="card"><div class="card-title">批量登记</div>
    <div style="display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin-bottom:10px">
      <div><label class="lab">学号 / 姓名（可扫码，输一个回车登记一个）</label>
        <input class="inp" id="lv_key" placeholder="输学号后回车" style="height:56px;font-size:22px;padding:0 16px;border-radius:10px" onkeydown="if(event.key==='Enter')lvBatchAdd()"></div>
      <div><label class="lab">日期</label><input class="inp" id="lv_date" type="date" value="${today}" style="height:50px;font-size:19px;padding:0 12px;border-radius:10px"></div>
      <div><label class="lab">类型</label><select class="inp" id="lv_type" style="height:50px;font-size:19px;border-radius:10px"><option>请假</option><option>缺勤</option><option>迟到</option><option>早退</option></select></div>
    </div>
    <div style="margin-top:18px;margin-bottom:8px"><label class="lab">事由（本次批量共用，可空）</label><input class="inp" id="lv_reason" placeholder="原因" style="height:50px;font-size:19px;padding:0 14px;border-radius:10px"></div>
    <div id="lv_stu" style="margin-top:4px;display:flex;flex-wrap:wrap;gap:4px"></div>
  </div>
  <div class="card"><div class="card-title">记录</div>
    <div style="display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap">
      <span class="lab" style="margin:0">查看日期</span>
      <input class="inp" id="lv_qdate" type="date" value="${today}" style="width:auto;height:50px;font-size:19px;padding:0 12px;border-radius:10px" onchange="lvRenderList()">
    </div>
    <div id="lv_list"></div>
  </div>`;
}
async function lvBatchAdd(){
  const me=await requireWriter(); if(!me)return;
  const key=($id("lv_key").value||"").trim();
  if(!key){toast("请输入学号或姓名");return;}
  let ms=[]; try{ ms=await fetchRows("members",{eq:{class_id:BIG.classId}}); }catch(e){}
  let m=ms.find(x=>(x.sid||"")===key)||ms.find(x=>(x.name||"")===key);
  if(!m){ const dz=key.replace(/\D/g,""); const dn=parseInt(dz,10); if(!isNaN(dn)){ m=ms.find(x=>parseInt(String(x.sid||"").replace(/\D/g,""),10)===dn); } }
  if(!m){toast("未找到学生："+key);return;}
  const date=$id("lv_date").value,type=$id("lv_type").value,reason=$id("lv_reason").value.trim();
  try{
    let ex=[]; try{ ex=await fetchRows("leaves",{eq:{class_id:BIG.classId,date}}); }catch(e){}
    if(ex.some(x=>x.member_id===m.id)){ toast("已登记 "+m.name); $id("lv_key").value=""; $id("lv_key").focus(); return; }
    await insertRow("leaves",{class_id:BIG.classId,member_id:m.id,date,type,reason});
    const box=$id("lv_stu"); box.insertAdjacentHTML("beforeend",`<span class="chip brand" style="margin:2px">${esc(m.name)} <span style="color:#b6bdf7">#${esc(m.sid||"")}</span></span>`);
    $id("lv_key").value=""; $id("lv_key").focus();
    if($id("lv_qdate").value===date) lvRenderList();
    toast("已登记 "+m.name);
  }catch(e){ toast("登记失败："+errMsg(e)); }
}
async function lvRenderList(){
  const qd=$id("lv_qdate").value;
  let ms=[],leaves=[]; try{ ms=await fetchRows("members",{eq:{class_id:BIG.classId}}); leaves=await fetchRows("leaves",{eq:{class_id:BIG.classId,date:qd}}); }catch(e){}
  leaves=leaves.sort((a,b)=>(b.created_at||"").localeCompare(a.created_at||""));
  $id("lv_list").innerHTML = leaves.length===0?'<div class="empty">该日期暂无记录</div>':`<table class="tbl"><thead><tr><th>学生</th><th>学号</th><th>类型</th><th>事由</th></tr></thead><tbody>${leaves.map(r=>{const m=ms.find(x=>x.id===r.member_id);return `<tr><td>${m?esc(m.name):"?"}</td><td>${m?esc(m.sid||""):""}</td><td><span class="chip ${r.type==="请假"?"brand":"danger"}">${esc(r.type)}</span></td><td>${esc(r.reason||"")}</td></tr>`;}).join("")}</tbody></table>`;
}
async function lvDel(id){ const me=await requireWriter(); if(!me)return; if(!confirm("删除该记录？"))return; try{ await deleteRows("leaves",{id}); lvRenderList(); }catch(e){ toast("删除失败："+errMsg(e)); } }
/* 大屏自动刷新：停留在请假/考勤页时每 5 秒自动重读当天记录 */
setInterval(()=>{ if(typeof BIG!=='undefined' && BIG.nav==='leave' && $id("lv_list")) lvRenderList(); },5000);
/* 班级公告每秒刷新 */
setInterval(()=>{ if(typeof BIG!=='undefined'){ checkAnnShow(); annCheckPlay(); if(BIG.nav==='announce' && $id("ann_box")) annRender(); } },1000);

setInterval(()=>{ if(typeof BIG!=='undefined' && BIG.nav==='today' && $id("today_box")) renderToday(); },30000);

setInterval(()=>{ if(typeof BIG!=='undefined' && BIG.nav==='homework' && $id("big_hw")) viewHomework({id:BIG.classId}); },1000);

document.addEventListener("DOMContentLoaded",renderBig);
/* 首次任意点击时静默解锁语音（不弹任何提示；exe 内已放行自动播放） */
document.addEventListener("click", function onceUnlock(){
  try{ if("speechSynthesis" in window){ var u=new SpeechSynthesisUtterance(" "); u.lang="zh-CN"; u.volume=0; window.speechSynthesis.speak(u); } }catch(e){}
  document.removeEventListener("click", onceUnlock, true);
}, true);
window.addEventListener("beforeunload",()=>{clearInterval(bigTimer);});
