<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教师后台管理系统</title>
<link rel="icon" href="assets/classroom.png">
<style>
:root{--bg:#eef2f7;--card:#fff;--ink:#1f2937;--muted:#6b7280;--brand:#2563eb;--brand-d:#1d4ed8;--brand-l:#dbeafe;--ok:#16a34a;--ok-l:#dcfce7;--warn:#d97706;--danger:#dc2626;--danger-l:#fee2e2;--line:#e5e7eb;--radius:14px;--shadow:0 1px 3px rgba(15,23,42,.08),0 6px 20px rgba(15,23,42,.06)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
button{font-family:inherit;cursor:pointer}input,select,textarea{font-family:inherit;font-size:14px}a{color:var(--brand);text-decoration:none}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#e8f0fe,#f5f7fb 45%,#eef6ff)}
.auth-card{background:#fff;border-radius:20px;box-shadow:var(--shadow);width:100%;max-width:400px;padding:34px 32px}
.auth-logo{width:54px;height:54px;border-radius:16px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;margin:0 auto 14px}
.auth-title{text-align:center;font-size:21px;font-weight:700;margin-bottom:4px}
.auth-sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:24px}
.field{margin-bottom:15px}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:500}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;outline:none}
.field input:focus,.field select:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-l)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:10px;font-size:15px;font-weight:600;padding:11px 18px;transition:.15s}
.btn-block{width:100%}.btn-primary{background:var(--brand);color:#fff}.btn-primary:hover{background:var(--brand-d)}
.btn-ghost{background:#fff;color:var(--brand);border:1px solid var(--brand)}.btn-ghost:hover{background:var(--brand-l)}
.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{background:#b91c1c}
.btn-ok{background:var(--ok);color:#fff}.btn-sm{padding:7px 12px;font-size:13px;border-radius:8px}
.auth-foot{text-align:center;font-size:13px;color:var(--muted);margin-top:18px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 22px;border-radius:10px;font-size:14px;z-index:9999;opacity:0;transition:opacity .25s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.2)}.toast.show{opacity:1}
.app{display:flex;min-height:100vh}
.sidebar{width:216px;background:#111a2e;color:#cbd5e1;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.side-brand{display:flex;align-items:center;gap:10px;padding:20px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
.side-brand .logo{width:34px;height:34px;border-radius:9px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px}
.side-brand .name{color:#fff;font-weight:600;font-size:15px}
.nav{flex:1;overflow-y:auto;padding:12px 10px}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;cursor:pointer;font-size:14px;color:#cbd5e1;transition:.12s;margin-bottom:2px;border:none;background:none;width:100%;text-align:left}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}.nav-item.active{background:var(--brand);color:#fff;font-weight:600}
.nav-item .ico{width:18px;height:18px;flex-shrink:0}
.side-user{padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:13px}
.side-user .uname{color:#fff;font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.main{flex:1;min-width:0;padding:24px 28px;overflow-x:hidden}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-title{font-size:22px;font-weight:700}.page-desc{color:var(--muted);font-size:13px;margin-top:3px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:18px}
.card-title{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.stat{display:flex;flex-direction:column;gap:4px;padding:16px;border-radius:12px;background:#f8fafc;border:1px solid var(--line)}
.stat .n{font-size:26px;font-weight:800;color:var(--brand)}.stat .l{font-size:12px;color:var(--muted)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input,.toolbar select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;outline:none}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl th{background:#f8fafc;color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap}.tbl tr:hover td{background:#f8fafc}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600}
.chip.ok{background:var(--ok-l);color:var(--ok)}.chip.warn{background:#fef3c7;color:var(--warn)}.chip.gray{background:#e5e7eb;color:#4b5563}.chip.brand{background:var(--brand-l);color:var(--brand-d)}
.badge3{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-size:13px;font-weight:800}
.b1{background:#fde68a;color:#92400e}.b2{background:#e5e7eb;color:#374151}.b3{background:#fcd9b6;color:#9a3412}
.honor-card{border:1px solid var(--line);border-radius:12px;padding:16px;text-align:center;background:linear-gradient(180deg,#fffdf5,#fff)}
.honor-card .medal{font-size:34px;margin-bottom:6px}.honor-card .nm{font-weight:700;font-size:16px}.honor-card .tp{color:var(--muted);font-size:12px;margin-top:4px}
.honor-card.top{background:linear-gradient(180deg,#fffbeb,#fff);border-color:#fcd34d}
.seat-grid{display:grid;gap:8px}.seat-grid .cell{border:1px solid var(--line);border-radius:8px;padding:8px 4px;text-align:center;font-size:12px;background:#f8fafc;min-height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:.12s;position:relative}
.seat-grid .cell:hover{border-color:var(--brand);background:var(--brand-l)}
.seat-grid .cell.filled{background:var(--brand-l);border-color:#93c5fd;font-weight:600}
.seat-grid .cell .x{position:absolute;top:2px;right:6px;color:#fca5a5;font-size:12px;display:none}
.seat-grid .cell:hover .x{display:block}
.seat-cell{cursor:grab}.seat-cell:active{cursor:grabbing}
.seat-cell.drag-over{outline:3px dashed var(--brand);outline-offset:-3px}
.col-head{display:flex;align-items:center;justify-content:center;font-weight:700;padding:8px;background:var(--brand-l);color:var(--brand-d);border-radius:8px;cursor:grab;margin-bottom:6px;user-select:none;font-size:13px}
.col-head.drag-over{outline:3px dashed var(--brand);outline-offset:-3px}
.col-head .mini{font-size:10px;color:var(--muted);margin-left:4px}
.row-label{display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted)}
.sched-grid{display:grid;gap:6px}.sched-grid .cell{border:1px solid var(--line);border-radius:8px;padding:8px;font-size:12px;text-align:center;background:#fff;cursor:pointer;min-height:52px;display:flex;align-items:center;justify-content:center}
.sched-grid .cell.filled{font-weight:600;color:#fff}
.form-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.form-row .field{margin-bottom:0;flex:1;min-width:120px}
.list-item{display:flex;align-items:center;justify-content:space-between;padding:9px 4px;border-bottom:1px dashed var(--line);font-size:14px}
.empty{text-align:center;color:var(--muted);padding:36px 10px;font-size:14px}
.duty-cell{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.mini-input{width:52px;padding:5px 6px;border:1px solid var(--line);border-radius:6px;outline:none;text-align:center}.mini-input:focus{border-color:var(--brand)}
.backdrop{position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:40;display:none;align-items:center;justify-content:center;padding:20px}.backdrop.open{display:flex}
.modal{background:#fff;border-radius:16px;box-shadow:var(--shadow);width:100%;max-width:520px;max-height:88vh;overflow-y:auto;padding:24px}
.modal h3{font-size:17px;margin-bottom:16px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}
.pill.unused{background:var(--ok-l);color:var(--ok)}.pill.used{background:var(--brand-l);color:var(--brand-d)}.pill.voided{background:var(--danger-l);color:var(--danger)}
.import-zone{border:2px dashed #cbd5e1;border-radius:12px;padding:28px;text-align:center;color:var(--muted);cursor:pointer;transition:.15s}.import-zone:hover{border-color:var(--brand);color:var(--brand)}
.hw-link{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.hw-link a{font-weight:600;font-size:15px}
.loading{text-align:center;color:var(--muted);padding:60px 20px}
.mode-tabs{display:flex;gap:6px}
.mode-tab{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
.mode-tab.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.subj-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.subj-chip{padding:5px 12px;border-radius:999px;background:#f1f5f9;border:1px solid var(--line);cursor:pointer;font-size:13px}
.subj-chip.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.stud-tag{font-size:11px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px 8px;min-width:64px;text-align:center}
.hw-grade-badge{padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600}
.g-sub{background:var(--ok-l);color:var(--ok)}.g-ok{background:#dcfce7;color:#15803d}.g-good{background:var(--brand-l);color:var(--brand-d)}.g-pass{background:#fef3c7;color:#b45309}.g-fail{background:var(--danger-l);color:var(--danger)}.g-none{background:#e5e7eb;color:#6b7280}
@media(max-width:820px){.app{flex-direction:column}.sidebar{width:100%;height:auto;position:relative;flex-direction:row;align-items:center}
.side-brand{padding:12px 14px;border-bottom:none}.nav{display:flex;overflow-x:auto;padding:8px;gap:4px}.nav-item{white-space:nowrap;flex-shrink:0}
.side-user{margin-left:auto;border-top:none;border-left:1px solid rgba(255,255,255,.08)}.main{padding:16px}
.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}.field input,.toolbar input,.mini-input,.form-row select{font-size:16px}.btn{min-height:44px}.auth-sub,.auth-foot{font-size:14px}}
@media(min-width:1500px){
  body{font-size:18px}
  .sidebar{width:260px}
  .side-brand{padding:26px 22px}
  .side-brand .logo{width:44px;height:44px;font-size:20px;border-radius:12px}
  .side-brand .name{font-size:19px}
  .nav{padding:16px 14px}
  .nav-item{font-size:17px;padding:14px 16px;border-radius:11px;gap:13px}
  .nav-item .ico{width:22px;height:22px}
  .side-user{padding:18px 20px;font-size:15px}
  .main{padding:36px 44px}
  .page-title{font-size:32px}
  .page-desc{font-size:16px}
  .card{padding:28px;border-radius:18px;margin-bottom:22px}
  .card-title{font-size:19px}
  .tbl{font-size:17px}
  .tbl th,.tbl td{padding:14px 16px}
  .btn{font-size:17px;padding:13px 22px;border-radius:12px}
  .btn-sm{padding:9px 15px;font-size:15px}
  .field input,.field select,.field textarea{padding:14px 14px;font-size:16px}
  .toolbar input,.toolbar select{padding:11px 13px;font-size:16px}
  .stat{padding:22px}
  .stat .n{font-size:36px}
  .stat .l{font-size:15px}
  .mini-input{width:60px;padding:7px 6px;font-size:15px}
  .seat-grid .cell{font-size:14px;min-height:54px}
  .sched-grid .cell{font-size:14px;min-height:60px}
  .list-item{font-size:16px;padding:12px 6px}
  .honor-card .nm{font-size:20px}
  .honor-card .medal{font-size:42px}
  .chip{font-size:14px;padding:3px 12px}
  .toast{font-size:16px;padding:14px 26px}
}
@media print{
  .sidebar{display:none!important}
  .main{margin:0!important;width:100%!important}
  .page-head .btn,.page-head button,.toolbar,.btn,.card-title button{display:none!important}
  .hw-op{display:none!important}
  .stu-op{display:none!important}
}
</style>

/* ===== 工具 ===== */
function $id(i){return document.getElementById(i);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function toast(m){const t=$id("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2400);}

function fmtYMD(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
async function sha256(str){
  if(window.crypto&&crypto.subtle){ try{ const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(str)); return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join(""); }catch(e){} }
  return sha256JS(str);
}
function sha256JS(ascii){
  function rr(v,a){return (v>>>a)|(v<<(32-a));}
  var mp=Math.pow,mw=mp(2,32),i,j,res='';
  var w=[],abl=ascii.length*8;
  var h=sha256JS.h=sha256JS.h||[],k=sha256JS.k=sha256JS.k||[],pc=k.length;
  var comp={}; for(var cand=2;pc<64;cand++){ if(!comp[cand]){ for(i=0;i<313;i+=cand)comp[i]=cand; h[pc]=(mp(cand,.5)*mw)|0; k[pc++]=(mp(cand,1/3)*mw)|0; } }
  ascii+='\x80'; while(ascii.length%64-56)ascii+='\x00';
  for(i=0;i<ascii.length;i++){ j=ascii.charCodeAt(i); if(j>>8)return; w[i>>2]|=j<<((3-i)%4)*8; }
  w[w.length]=((abl/mw)|0); w[w.length]=(abl);
  for(j=0;j<w.length;){ var ws=w.slice(j,j+=16),oh=h; h=h.slice(0,8);
    for(i=0;i<64;i++){ var w15=ws[i-15],w2=ws[i-2]; var a=h[0],e=h[4]; var t1=h[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&h[5])^((~e)&h[6]))+k[i]+(ws[i]=(i<16)?ws[i]:(ws[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+ws[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0); var t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&h[1])^(a&h[2])^(h[1]&h[2])); h=[(t1+t2)|0].concat(h); h[4]=(h[4]+t1)|0; }
    for(i=0;i<8;i++)h[i]=(h[i]+oh[i])|0;
  }
  for(i=0;i<8;i++){ for(j=3;j+1;j--){ var b=(h[i]>>(j*8))&255; res+=((b<16)?0:'')+b.toString(16); } }
  return res;
}

/* ===== 登录态（Supabase Auth 会话，存 localStorage） ===== */
/* 账号名 → 隐藏邮箱：hex(UTF8(账号名)) + "@class.local"，与数据库迁移脚本算法一致 */
function acctToEmail(loginName){
  const hex=Array.from(new TextEncoder().encode(String(loginName==null?"":loginName)))
    .map(b=>b.toString(16).padStart(2,"0")).join("");
  return hex+"@class.local";
}
function acctFromEmail(email){
  if(!email||!email.includes("@"))return email||"";
  const hex=email.split("@")[0];
  try{
    const bytes=new Uint8Array(hex.match(/.{1,2}/g).map(h=>parseInt(h,16)));
    return new TextDecoder().decode(bytes);
  }catch(e){ return email; }
}
async function getMe(){
  try{
    const {data:{session}}=await sb.auth.getSession();
    if(!session||!session.user)return null;
    const acc=await fetchOne("user_account",{auth_id:session.user.id});
    if(!acc)return {id:session.user.id,login_name:acctFromEmail(session.user.email),role:"unknown",auth_id:session.user.id};
    return {id:acc.id,login_name:acc.login_name,role:acc.role,auth_id:acc.auth_id||session.user.id};
  }catch(e){ return null; }
}
async function setMe(m){ /* 会话由 Supabase 管理，无需额外存储 */ return m; }
function clearMe(){ /* Supabase Auth 会话在 doLogout 中 signOut 处理 */ }

/* ===== 数据访问 ===== */
async function fetchRows(table,filter){let q=sb.from(table).select("*");if(filter){if(filter.eq)Object.entries(filter.eq).forEach(([k,v])=>q=q.eq(k,v));if(filter.in)Object.entries(filter.in).forEach(([k,v])=>q=q.in(k,v));}const {data,error}=await q;if(error)throw error;return data||[];}
async function fetchOne(table,filter){const {data,error}=await sb.from(table).select("*").match(filter).maybeSingle();if(error)throw error;return data;}
async function insertRow(table,row){const {data,error}=await sb.from(table).insert(row).select().single();if(error)throw error;return data;}
async function insertMany(table,rows){const {data,error}=await sb.from(table).insert(rows);if(error)throw error;return data;}
async function updateRows(table,filter,patch){const {data,error}=await sb.from(table).update(patch).match(filter);if(error)throw error;return data;}
async function deleteRows(table,filter){const {error}=await sb.from(table).delete().match(filter);if(error)throw error;}

/* ===== 渲染分发 ===== */
async function render(){
  const h=hash();
  if(h.startsWith("#/register")){renderRegister();return;}
  if(h.startsWith("#/home")){
    const me=await getMe();
    if(!me){ location.hash="#/login"; renderLogin(); return; }
    renderMain(); return;
  }
  renderLogin();
}
document.addEventListener("DOMContentLoaded",()=>{window.addEventListener("hashchange",render);render();});

/* ===== 登录 ===== */
function renderLogin(){
  $id("app").innerHTML=`
  <div class="auth-wrap"><div class="auth-card">
    <div class="auth-logo"><img src="assets/classroom.png" alt="logo" style="width:100%;height:100%;object-fit:cover;border-radius:16px"></div><div class="auth-title">教师后台管理系统</div><div class="auth-sub">云端版 · 教师使用</div>
    <div class="field"><label>账号</label><input id="li_user" placeholder="请输入账号"></div>
    <div class="field"><label>密码</label><input id="li_pass" type="password" placeholder="请输入密码"></div>
    <button class="btn btn-primary btn-block" onclick="doLogin()">登录</button>
    <div class="auth-foot">没有账号？<a href="#/register">新账号注册</a></div>
  </div></div>`;
  $id("li_user").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin();});
  $id("li_pass").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin();});
}
async function doLogin(){
  const u=$id("li_user").value.trim(),p=$id("li_pass").value;
  if(!u||!p){toast("请输入账号和密码");return;}
  try{
    const {data,error}=await sb.auth.signInWithPassword({email:acctToEmail(u),password:p});
    if(error){ throw error; }
    const acc=await fetchOne("user_account",{auth_id:data.user.id});
    if(!acc){ await sb.auth.signOut(); toast("账号未关联教师权限，请联系管理员"); return; }
    if(acc.role==="admin"){ await sb.auth.signOut(); toast("管理员请打开「管理员后台」登录"); return; }
    loadST(); ST.classId=null; ST.nav="dashboard"; saveST();
    location.hash="#/home"; renderMain();
  }catch(e){ toast("登录失败："+errMsg(e)); }
}

/* ===== 注册（验证码） ===== */
let regStep=1;
function renderRegister(){
  regStep=1;
  $id("app").innerHTML=`
  <div class="auth-wrap"><div class="auth-card">
    <div class="auth-logo">班</div><div class="auth-title">新账号注册</div><div class="auth-sub" id="rg_sub">向管理员获取 6 位注册验证码</div>
    <div id="rg_step1">
      <div class="field"><label>注册验证码</label><input id="rg_code" maxlength="6" placeholder="6位验证码"></div>
      <button class="btn btn-primary btn-block" onclick="rgCheckCode()">确认验证码</button>
    </div>
    <div id="rg_step2" style="display:none">
      <div class="field"><label>登录账号</label><input id="rg_name" placeholder="设置登录账号"></div>
      <div class="field"><label>登录密码（至少6位）</label><input id="rg_pass" type="password" placeholder="设置登录密码"></div>
      <button class="btn btn-primary btn-block" onclick="doRegister()">提交注册</button>
    </div>
    <div class="auth-foot"><a href="#/login">返回登录</a></div>
  </div></div>`;
}
async function rgCheckCode(){
  const code=$id("rg_code").value.trim();
  if(!code||code.length!==6){toast("请输入6位验证码");return;}
  try{
    const {data:ok,error}=await sb.rpc('check_registration_code',{p_code:code});
    if(error)throw error;
    if(!ok){toast("验证码无效或已使用");return;}
    $id("rg_step1").style.display="none"; $id("rg_step2").style.display="block";
    $id("rg_sub").textContent="验证码有效，请设置账号和密码";
  }catch(e){ toast("验证码校验失败："+errMsg(e)); }
}
async function doRegister(){
  const code=$id("rg_code").value.trim(),name=$id("rg_name").value.trim(),pwd=$id("rg_pass").value;
  if(!name||!pwd){toast("请填写账号和密码");return;}
  if(pwd.length<6){toast("密码至少6位");return;}
  try{
    const {data:ok}=await sb.rpc('check_registration_code',{p_code:code});
    if(!ok){toast("验证码无效或已使用");return;}
    const email=acctToEmail(name);
    const {data,error}=await sb.auth.signUp({email,password:pwd});
    if(error){ if(error.message&&error.message.includes("already")){toast("该账号已被注册");} else {toast("注册失败："+errMsg(error));} return; }
    // 记录账号（auth_id 关联当前会话用户）
    const {error:ierr}=await sb.from("user_account").insert({auth_id:data.user.id,login_name:name,role:"teacher"});
    if(ierr){ toast("账号写入失败："+errMsg(ierr)); return; }
    try{ await sb.rpc('consume_registration_code',{p_code:code}); }catch(e){}
    loadST(); ST.classId=null; ST.nav="dashboard"; saveST();
    location.hash="#/home"; renderMain();
    toast("注册成功，等待管理员分配班级");
  }catch(e){ toast("注册失败："+errMsg(e)); }
}

async function renderMain(){
  const me=await getMe(); if(!me){location.hash="#/login";return;}
  loadST();
  try{
    const rels=await fetchRows("class_user_rel",{eq:{user_id:me.id}});
    const cids=rels.map(r=>r.class_id);
    let classes=[]; if(cids.length)classes=await fetchRows("classes",{in:{id:cids}});
    if(classes.length&&!classes.some(c=>c.id===ST.classId)){ST.classId=classes[0].id;saveST();}
    if(ST.classId&&!classes.some(c=>c.id===ST.classId)){ST.classId=classes.length?classes[0].id:null;saveST();}
    const cls=classes.find(c=>c.id===ST.classId)||null;
    if(!cls){ renderNoClass(); return; }
    const curRel=rels.find(r=>r.class_id===cls.id)||null;
    const subject=curRel?curRel.subject:"";
    if(!ST.scoreSubject){ ST.scoreSubject=subject||""; saveST(); }
    const head=`<span class="chip brand">${esc(cls.name)}</span>`+(subject?`<span class="chip gray">${esc(subject)}</span>`:"")+(cls.invite_code?`<span class="chip gray">班级码 ${esc(cls.invite_code)}</span>`:"");
    $id("app").innerHTML=`
    <div class="app"><aside class="sidebar">
      <div class="side-brand"><div class="logo"><img src="assets/classroom.png" alt="logo" style="width:100%;height:100%;object-fit:cover;border-radius:9px"></div><div class="name">教师后台管理系统</div></div>
      <nav class="nav">${NAVS.map(n=>`<button class="nav-item ${ST.nav===n[0]?"active":""}" onclick="go('${n[0]}')"><svg class="ico" viewBox="0 0 24 24" fill="currentColor"><path d="${ICONS[n[0]]}"/></svg>${n[1]}</button>`).join("")}</nav>
      <div class="side-user"><div class="uname">${esc(me.login_name)}</div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${head}${classes.length>1?`<button class="btn btn-sm" style="background:rgba(255,255,255,.1);color:#fff" onclick="showSelectClass()">切换班级</button>`:""}<button class="btn btn-sm" style="background:rgba(255,255,255,.1);color:#fff" onclick="doLogout()">退出</button></div></div>
    </aside><main class="main" id="main_area"></main></div>`;

    $id("main_area").innerHTML=_vb;

}

async function showSelectClass(){
  const me=await getMe(); if(!me)return;
  try{
    const rels=await fetchRows("class_user_rel",{eq:{user_id:me.id}});
    const classes=await fetchRows("classes",{in:{id:rels.map(r=>r.class_id)}});
    $id("app").insertAdjacentHTML("beforeend",`<div class="backdrop open" id="sel_modal"><div class="modal"><h3>选择班级</h3>${classes.map(c=>`<button class="btn btn-ghost btn-block" style="margin-bottom:8px;justify-content:flex-start" onclick="switchClassTo('${esc(c.id)}')">${esc(c.name)}${c.id===ST.classId?'　<span class="chip ok">当前</span>':""}</button>`).join("")}<button class="btn btn-ghost btn-block" onclick="closeModal('sel_modal')">取消</button></div></div>`);
  }catch(e){ toast("加载班级失败："+errMsg(e)); }
}

async function regenClassCode(){ if(!confirm("重新生成班级码？班级大屏需用新码进入。"))return; try{ const existing=await fetchRows("classes"); const have=new Set(existing.map(c=>c.invite_code).filter(Boolean)); let ic=genCode(6); let guard=0; while(have.has(ic)&&guard<50){ic=genCode(6);guard++;} await updateRows("classes",{id:ST.classId},{invite_code:ic}); toast("新班级码："+ic); renderMain(); }catch(e){ toast("操作失败："+errMsg(e)); } }

async function viewAnnounce(cls){

  const a=ann[0]||{};
  const pt=(a.play_time||"").split(":");
  const hh=pt[0]||"", mm=pt[1]||"";
  const mode=(a.play_time&&a.play_time.includes(":"))?"sched":"none";
  return `<div class="page-head"><div><div class="page-title">班级公告</div><div class="page-desc">编辑班级通知、今日安排，大屏滚动显示</div></div></div>
  <div class="card"><div class="card-title">公告内容</div>
    <textarea class="inp" id="ann_content" rows="12" style="width:100%;box-sizing:border-box;font-size:18px;line-height:1.8;padding:14px;border-radius:10px" placeholder="输入班级通知、今日安排...">${esc(a.content||"")}</textarea>
    <div style="margin-top:12px"><button class="btn btn-primary" onclick="annSave()">保存公告</button></div>
    <div style="margin-top:16px"><label class="lab">播放时间</label>
      <select class="inp" id="ann_mode" onchange="annModeToggle()" style="height:50px;font-size:19px;border-radius:10px;margin-top:6px">
        <option value="none" ${mode==="none"?"selected":""}>不播放</option>
        <option value="now" ${mode==="now"?"selected":""}>立即播放</option>
        <option value="sched" ${mode==="sched"?"selected":""}>定时播放</option>
      </select>
    </div>
    <div id="ann_now_panel" style="margin-top:14px;display:${mode==="now"?"block":"none"}">
      <div style="font-size:15px;color:#16a34a;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:10px 14px;margin-bottom:12px">选好后点「确认播报」，立即通知大屏语音播报</div>
      <label class="lab">播放次数（循环朗读几遍）</label>
      <input class="inp" id="ann_count_now" type="number" min="1" value="${a.play_count||1}" style="width:130px;height:50px;font-size:22px;text-align:center;border-radius:10px;margin-top:6px">
      <div style="margin-top:14px"><button class="btn btn-primary" onclick="annNotifyNow()">📣 确认播报</button></div>
    </div>
    <div id="ann_sched_panel" style="margin-top:14px;display:${mode==="sched"?"block":"none"}">
      <label class="lab">定时时间</label>
      <div style="display:flex;gap:8px;align-items:center;margin-top:6px">
        <input class="inp" id="ann_hh" type="number" min="0" max="23" placeholder="时" value="${esc(hh)}" style="width:100px;height:52px;font-size:22px;text-align:center;border-radius:10px">
        <span style="font-size:24px;font-weight:700;color:#64748b">:</span>
        <input class="inp" id="ann_mm" type="number" min="0" max="59" placeholder="分" value="${esc(mm)}" style="width:100px;height:52px;font-size:22px;text-align:center;border-radius:10px">
      </div>
      <div style="margin-top:12px"><label class="lab">播放方式</label>
        <select class="inp" id="ann_repeat" onchange="annRepeatToggle()" style="height:50px;font-size:19px;border-radius:10px;margin-top:6px">
          <option value="once" ${a.repeat==="daily"?"":"selected"}>只播一组</option>
          <option value="daily" ${a.repeat==="daily"?"selected":""}>每天播</option>
        </select>
      </div>
      <div id="ann_count_box" style="margin-top:12px;${a.repeat==="daily"?"display:none":""}"><label class="lab">播放次数（循环朗读几遍）</label>
        <input class="inp" id="ann_count" type="number" min="1" value="${a.play_count||1}" style="width:130px;height:50px;font-size:22px;text-align:center;border-radius:10px;margin-top:6px">
      </div>
      <div style="margin-top:14px"><button class="btn btn-primary" onclick="annSaveSched()">⏰ 确认播报时间</button></div>
    </div>
    <div id="ann_msg" style="margin-top:12px;color:#16a34a;font-size:15px"></div>
  </div>`;
}
function annRepeatToggle(){
  const box=$id("ann_count_box"); if(!box)return;
  box.style.display=$id("ann_repeat").value==="once"?"":"none";
}
async function annSave(){
  const content=$id("ann_content").value.trim();
  if(!content){toast("请输入公告内容");return;}
  const mode=$id("ann_mode").value;
  let playTime="",repeat="once",playCount=1,notifyAt=null;
  if(mode==="now"){
    playCount=Math.max(1,parseInt($id("ann_count_now").value||"1",10)||1);
  } else if(mode==="sched"){
    const hh=String(Math.min(23,Math.max(0,parseInt($id("ann_hh").value||"0",10)||0))).padStart(2,"0");
    const mm=String(Math.min(59,Math.max(0,parseInt($id("ann_mm").value||"0",10)||0))).padStart(2,"0");
    playTime=hh+":"+mm;
    repeat=$id("ann_repeat").value;
    playCount=repeat==="once"?Math.max(1,parseInt($id("ann_count").value||"1",10)||1):1;
  }
  try{
    const ex=await fetchRows("announcements",{eq:{class_id:ST.classId}});
    const fields={content,play_time:playTime,repeat,play_count:playCount,notify_at:notifyAt,show_flag:new Date().toISOString()};
    if(ex.length>0){ await updateRows("announcements",{id:ex[0].id},fields); }
    else { await insertRow("announcements",{class_id:ST.classId,...fields}); }
    $id("ann_msg").innerHTML= mode==="now"?"已保存，点「确认播报」可立即通知大屏":mode==="sched"?"已保存，大屏将滚动显示，到点自动语音播报":"已保存，大屏滚动显示（不播报）";
    toast("公告已保存");
  }catch(e){ toast("保存失败："+errMsg(e)); }
}
function annModeToggle(){
  const m=$id("ann_mode").value;
  const np=$id("ann_now_panel"),sp=$id("ann_sched_panel");
  if(np)np.style.display=m==="now"?"block":"none";
  if(sp)sp.style.display=m==="sched"?"block":"none";
}
async function annNotifyNow(){
  const content=$id("ann_content").value.trim();
  if(!content){toast("请输入公告内容");return;}
  const playCount=Math.max(1,parseInt($id("ann_count_now").value||"1",10)||1);
  const notifyAt=new Date().toISOString();
  try{
    const ex=await fetchRows("announcements",{eq:{class_id:ST.classId}});
    const fields={content,play_time:"",repeat:"once",play_count:playCount,notify_at:notifyAt,show_flag:new Date().toISOString()};
    if(ex.length>0){ await updateRows("announcements",{id:ex[0].id},fields); }
    else { await insertRow("announcements",{class_id:ST.classId,...fields}); }
    $id("ann_msg").innerHTML="已确认播报，大屏现在语音播报";
    toast("已确认播报");
  }catch(e){ toast("播报失败："+errMsg(e)); }
}
async function annSaveSched(){
  const content=$id("ann_content").value.trim();
  if(!content){toast("请输入公告内容");return;}
  const hh=String(Math.min(23,Math.max(0,parseInt($id("ann_hh").value||"0",10)||0))).padStart(2,"0");
  const mm=String(Math.min(59,Math.max(0,parseInt($id("ann_mm").value||"0",10)||0))).padStart(2,"0");
  const playTime=hh+":"+mm;
  const repeat=$id("ann_repeat").value;
  const playCount=repeat==="once"?Math.max(1,parseInt($id("ann_count").value||"1",10)||1):1;
  try{
    const ex=await fetchRows("announcements",{eq:{class_id:ST.classId}});
    const fields={content,play_time:playTime,repeat,play_count:playCount,notify_at:null,show_flag:new Date().toISOString()};
    if(ex.length>0){ await updateRows("announcements",{id:ex[0].id},fields); }
    else { await insertRow("announcements",{class_id:ST.classId,...fields}); }

/* ===== 计时器（倒计时 + 正计时） ===== */
let timerS={mode:"cd",running:false,total:300,remain:300,elap:0,int:null};
function timerFmt(s){s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=s%60;return (h?String(h).padStart(2,"0")+":":"")+String(m).padStart(2,"0")+":"+String(ss).padStart(2,"0");}
function timerTick(){ if(timerS.mode==="cd"){ timerS.remain=Math.max(0,timerS.remain-1); const el=$id("timer_disp"); if(el)el.textContent=timerFmt(timerS.remain); if(timerS.remain<=0){ clearInterval(timerS.int); timerS.running=false; const d=$id("timer_disp"); if(d){d.textContent="00:00";d.style.color="var(--danger)";} const b=$id("timer_btn"); if(b)b.textContent="开始"; toast("倒计时结束！"); } } else { timerS.elap++; const el=$id("timer_disp"); if(el)el.textContent=timerFmt(timerS.elap); } }
function timerToggle(){ if(timerS.running){ timerPause(); } else { timerStart(); } }
function timerStart(){ if(timerS.running)return; if(timerS.mode==="cd"&&timerS.remain<=0){toast("倒计时已结束，请重置");return;} timerS.running=true; timerS.int=setInterval(timerTick,1000); const d=$id("timer_disp"); if(d)d.style.color=""; const b=$id("timer_btn"); if(b)b.textContent="暂停"; }
function timerPause(){ if(!timerS.running)return; clearInterval(timerS.int); timerS.running=false; const b=$id("timer_btn"); if(b)b.textContent="开始"; }
function timerReset(){ clearInterval(timerS.int); timerS.running=false; if(timerS.mode==="cd"){ const inp=$id("timer_min"); const m=parseInt(inp?inp.value:"",10)||5; timerS.total=Math.max(1,m*60); timerS.remain=timerS.total; } else { timerS.elap=0; } const d=$id("timer_disp"); if(d){d.textContent=timerFmt(timerS.mode==="cd"?timerS.remain:timerS.elap); d.style.color="";} const b=$id("timer_btn"); if(b)b.textContent="开始"; }
function timerSetMode(m){ clearInterval(timerS.int); timerS.running=false; timerS.mode=m; if(m==="cd"){ const inp=$id("timer_min"); const v=parseInt(inp?inp.value:"",10)||5; timerS.total=Math.max(1,v*60); timerS.remain=timerS.total; } else { timerS.elap=0; } const d=$id("timer_disp"); if(d){d.textContent=timerFmt(m==="cd"?timerS.remain:timerS.elap); d.style.color="";} const b=$id("timer_btn"); if(b)b.textContent="开始"; }
function viewTimer(){
  return `<div class="page-head"><div><div class="page-title">计时器</div><div class="page-desc">课堂倒计时 / 正计时</div></div></div>
  <div class="card" style="text-align:center;padding:32px">
    <div style="display:flex;gap:8px;justify-content:center;margin-bottom:20px">
      <button class="btn ${timerS.mode==="cd"?"btn-primary":"btn-ghost"}" onclick="timerSetMode('cd')">倒计时</button>
      <button class="btn ${timerS.mode==="st"?"btn-primary":"btn-ghost"}" onclick="timerSetMode('st')">正计时</button>
    </div>
    <div id="timer_disp" style="font-size:88px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:4px;line-height:1.1">${timerFmt(timerS.mode==="cd"?timerS.remain:timerS.elap)}</div>
    <div style="margin-top:20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      ${timerS.mode==="cd"?`<div style="display:flex;gap:6px;align-items:center"><input id="timer_min" type="number" min="1" max="120" value="${Math.max(1,Math.round(timerS.total/60))}" style="width:80px;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:18px;text-align:center"><span style="color:var(--muted)">分钟</span></div>`:""}
      <button id="timer_btn" class="btn btn-primary" onclick="timerToggle()">${timerS.running?"暂停":"开始"}</button>
      <button class="btn btn-danger" onclick="timerReset()">重置</button>
    </div>
  </div>`;
}
/* ===== 数据工具：导出 / 打印 / 随机抽人 ===== */
function downloadExcel(name,sheetTitle,headers,rows,preRows){
  const escx=v=>String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  let xml='<?xml version="1.0"?><?mso-application progid="Excel.Sheet"?>';
  xml+='<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Worksheet ss:Name="'+escx(sheetTitle)+'"><Table>';
  (preRows||[]).forEach(r=>{xml+='<Row>'+r.map(v=>'<Cell><Data ss:Type="String">'+escx(v)+'</Data></Cell>').join('')+'</Row>';});
  xml+='<Row>'+headers.map(h=>'<Cell ss:StyleID="h"><Data ss:Type="String">'+escx(h)+'</Data></Cell>').join('')+'</Row>';
  rows.forEach(r=>{xml+='<Row>'+r.map(v=>'<Cell><Data ss:Type="String">'+escx(v)+'</Data></Cell>').join('')+'</Row>';});
  xml+='</Table></Worksheet></Workbook>';
  const blob=new Blob(["\ufeff"+xml],{type:"application/vnd.ms-excel;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
}

let IMP_ROWS=[];
function previewImport(){
  const txt=$id("imp_text").value.trim(); if(!txt){toast("请粘贴文本或选择文件");return;}
  const lines=txt.split(/\r?\n/); const rows=[];
  lines.forEach((line,idx)=>{
    const t=line.trim(); if(!t)return;
    const parts0=t.split(/[,\t，]+/).map(x=>x.trim()).filter(Boolean);
    const parts=parts0.length<2?t.split(/\s+/).map(x=>x.trim()).filter(Boolean):parts0;
    if(parts.length===0)return;
    if(idx===0&&/^sid|^s\s*i\s*d|^学号|name/i.test(parts[0])&&(parts.length===1||/^name|^姓名/i.test(parts[1])))return; // 跳过 SID,NAME 表头
    const sid=parts[0],name=parts[1]||"";
    if(!name){toast("第 "+(idx+1)+" 行缺姓名，已跳过：`"+t.slice(0,30)+"`");return;}
    rows.push({sid,name});
  });
  IMP_ROWS=rows;
  if(!rows.length){$id("imp_preview").innerHTML='<div class="empty" style="padding:10px">没有可导入的数据</div>';$id("imp_confirm").style.display="none";return;}
  $id("imp_preview").innerHTML=`<div style="margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:10px"><div style="font-weight:600;margin-bottom:8px">待确认 ${rows.length} 人（请核对后点「确认导入」）</div>
    <div style="max-height:220px;overflow:auto"><table class="tbl"><thead><tr><th>学号</th><th>姓名</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.sid||"—")}</td><td>${esc(r.name)}</td></tr>`).join("")}</tbody></table></div></div>`;
  $id("imp_confirm").style.display="";
}

function mondayOf(d){const x=new Date(d);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);x.setHours(0,0,0,0);return x;}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
const WEEK_DAY_CN=["一","二","三","四","五"];
function dutyWeekKey(){ if(ST.dutyMode==="fixed")return "fixed"; return ST.dutyWeek||fmtYMD(mondayOf(new Date())); }

async function addDutyMember(mid,day){
  const task=$id("dp_task_"+mid).value.trim(); if(!task){toast("请先填写值日项目");return;}
  const week=dutyWeekKey();
  try{
    let rec=await fetchOne("duty",{class_id:ST.classId,week_key:week,day});
    let ids=rec&&rec.member_ids?rec.member_ids.slice():[];
    if(ids.includes(mid)){ toast("该学生已在周"+WEEK_DAY_CN[day]); return; }
    ids.push(mid);
    let tasks=rec&&rec.tasks?Object.assign({},rec.tasks):{};
    tasks[mid]=task;
    if(rec) await updateRows("duty",{id:rec.id},{member_ids:ids,tasks}); else await insertRow("duty",{class_id:ST.classId,week_key:week,day,member_ids:ids,tasks});
    closeModal("dp_modal"); renderMain();
  }catch(e){ toast("保存失败："+errMsg(e)); }
}
async function removeDutyMember(mid,day){
  const week=dutyWeekKey(); try{
    let rec=await fetchOne("duty",{class_id:ST.classId,week_key:week,day}); if(!rec)return;
    let ids=(rec.member_ids||[]).filter(x=>x!==mid);
    let tasks=Object.assign({},rec.tasks||{}); delete tasks[mid];
    await updateRows("duty",{id:rec.id},{member_ids:ids,tasks}); renderMain();
  }catch(e){ toast("操作失败："+errMsg(e)); }
}

async function applySeatGroups(){

async function openGroupPicker(gidx){

function filterGroupPick(){ const q=($id("gp_search").value||"").trim().toLowerCase(); document.querySelectorAll("#gp_list .list-item").forEach(r=>{r.style.display=q?(r.dataset.k.toLowerCase().includes(q)?"":"none"):"";}); }
async function addGroupMember(mid,gidx){
  try{
    let gs=await fetchRows("groups",{eq:{class_id:ST.classId}}); gs=gs.sort((a,b)=>a.group_index-b.group_index);
    gs.forEach(g=>{const i=g.member_ids.indexOf(mid);if(i>=0)g.member_ids.splice(i,1);});
    let g=gs[gidx];
    if(g){ if(!g.member_ids.includes(mid))g.member_ids.push(mid); }
    else{ g={class_id:ST.classId,group_index:gidx,member_ids:[mid]}; gs.push(g); }
    for(const x of gs) await updateRows("groups",{id:x.id},{member_ids:x.member_ids});
    renderMain(); closeModal("gp_modal"); toast("已加入第 "+(gidx+1)+" 组");
  }catch(e){ toast("添加失败："+errMsg(e)); }
}
async function removeGroupMember(mid){
  try{
    let gs=await fetchRows("groups",{eq:{class_id:ST.classId}}); gs=gs.sort((a,b)=>a.group_index-b.group_index);
    gs.forEach(g=>{const i=g.member_ids.indexOf(mid);if(i>=0)g.member_ids.splice(i,1);});
    for(const g of gs) await updateRows("groups",{id:g.id},{member_ids:g.member_ids});
    renderMain(); toast("已移出分组");
  }catch(e){ toast("移除失败："+errMsg(e)); }
}
async function moveStudent(id,gidx){
  try{
    let gs=await fetchRows("groups",{eq:{class_id:ST.classId}}); gs=gs.sort((a,b)=>a.group_index-b.group_index);
    gs.forEach(g=>{const i=g.member_ids.indexOf(id);if(i>=0)g.member_ids.splice(i,1);});
    if(gs[gidx]){gs[gidx].member_ids.push(id);}
    for(const g of gs) await updateRows("groups",{id:g.id},{member_ids:g.member_ids});
    renderMain();
  }catch(e){ toast("移动失败："+errMsg(e)); }
}
async function clearGroups(){ try{ await deleteRows("groups",{class_id:ST.classId}); renderMain(); }catch(e){ toast("清除失败："+errMsg(e)); } }
async function newGroup(){
  try{
    let gs=await fetchRows("groups",{eq:{class_id:ST.classId}}); gs=gs.sort((a,b)=>a.group_index-b.group_index);
    const gidx=gs.length?gs[gs.length-1].group_index+1:0;
    await insertRow("groups",{class_id:ST.classId,group_index:gidx,member_ids:[]});
    renderMain(); toast("已新建第 "+(gidx+1)+" 组，点「+ 添加学生」加入");
  }catch(e){ toast("新建失败："+errMsg(e)); }
}

/* ===== 座位表（整组拖拽换座 + 单人互换） ===== */
async function viewSeats(cls){
  let data=null; try{ data=await fetchOne("seat_plans",{class_id:cls.id}); }catch(e){}
  const rows=data?data.rows:6, cols=data?data.cols:8, grid=data&&data.grid?data.grid:[];
  let ms=[]; try{ ms=await fetchRows("members",{eq:{class_id:cls.id}}); }catch(e){}
  const flat=grid.flat().filter(Boolean);
  const colCount=grid.length?grid[0].length:0;
  const cellHtml=(r,c)=>{const mid=grid[r]?grid[r][c]:null;const m=mid?ms.find(x=>x.id===mid):null;
    return `<div class="seat-grid cell seat-cell ${m?"filled":""}" draggable="true" ondragstart="seatDragStart(event,${r},${c})" ondragover="seatDragOver(event,${r},${c})" ondragleave="seatDragLeave(event)" ondrop="seatDrop(event,${r},${c})" onclick="seatClick(${r},${c})">${m?`<span>${esc(m.name)}</span><span style="font-size:11px;color:var(--brand-d)">${esc(m.sid||"")}</span><span class="x" onclick="event.stopPropagation();seatRemove(${r},${c})">×</span>`:`<span style="color:${pickedMid?'#2563eb':'#94a3b8'};font-weight:${pickedMid?700:400}">${pickedMid?'点击放入':'空'}</span>`}</div>`;};
  const colHeadHtml=(c)=>{const cnt=grid.reduce((a,row)=>a+((row[c])?1:0),0);return `<div class="col-head" draggable="true" ondragstart="colDragStart(event,${c})" ondragover="colDragOver(event,${c})" ondragleave="seatDragLeave(event)" ondrop="colDrop(event,${c})">第${c+1}组<span class="mini">${cnt}人</span></div>`;};
  const unassigned=ms.filter(m=>!flat.includes(m.id));
  return `<div class="page-head"><div><div class="page-title">座位表</div><div class="page-desc">拖动顶部组头整组换座；拖动单个学生与其他人互换；点下方学生再点空座位放入</div></div>
    <div style="display:flex;gap:8px;align-items:center"><input id="se_r" type="number" min="1" max="15" value="${rows}" style="width:64px;padding:8px;border:1px solid var(--line);border-radius:8px"><span style="color:var(--muted)">行</span>
    <input id="se_c" type="number" min="1" max="15" value="${cols}" style="width:64px;padding:8px;border:1px solid var(--line);border-radius:8px"><span style="color:var(--muted)">列</span>
    <button class="btn btn-ghost btn-sm" onclick="buildSeats()">生成</button><button class="btn btn-ghost btn-sm" onclick="autoSeat()">自动排座</button><button class="btn btn-danger btn-sm" onclick="clearSeats()">清空</button><button class="btn btn-ghost btn-sm" onclick="exportSeats()">导出座位表</button><button class="btn btn-ghost btn-sm" onclick="printSeats()">打印座位表</button></div></div></div>
  <div class="card">${!grid.length?'<div class="empty">设置行列后点「生成」，或点「自动排座」</div>':`
    <div class="seat-grid" style="grid-template-columns:40px repeat(${colCount},1fr)"><div></div>${grid[0].map((_,c)=>colHeadHtml(c)).join("")}${grid.map((row,r)=>[`<div class="row-label">第${r+1}排</div>`,...row.map((_,c)=>cellHtml(r,c))].join("")).join("")}</div>
    <div style="margin-top:14px;font-size:12px;color:var(--muted)">已安排 ${flat.length} 人，未安排 ${unassigned.length} 人</div>
    <div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center"><span style="font-size:13px;color:var(--muted)">未安排学生（点学生，再点空座位放入）：</span>${unassigned.map(m=>`<button class="btn btn-sm ${pickedMid===m.id?'btn-primary':'btn-ghost'}" onclick="seatPick('${esc(m.id)}')">${esc(m.name)}</button>`).join("")||'<span style="color:var(--muted)">全部已安排</span>'}</div>`}</div>`;
}
let dragData=null;
let pickedMid=null;
async function seatPick(mid){ pickedMid=pickedMid===mid?null:mid; renderMain(); if(pickedMid)toast("已选，点击空座位放入"); }
async function seatClick(r,c){
  if(!pickedMid)return;
  try{ let data=await fetchOne("seat_plans",{class_id:ST.classId}); if(!data||!data.grid.length){pickedMid=null;return;} const g=data.grid;
    if(g[r]&&g[r][c]!=null){ toast("该座位已有人"); return; }
    g[r][c]=pickedMid; pickedMid=null; await saveSeat(data.rows,data.cols,g); renderMain(); toast("已放入座位");
  }catch(e){ toast("操作失败："+errMsg(e)); }
}
async function seatRemove(r,c){
  try{ let data=await fetchOne("seat_plans",{class_id:ST.classId}); if(!data||!data.grid.length)return; const g=data.grid; if(g[r])g[r][c]=null; await saveSeat(data.rows,data.cols,g); renderMain(); toast("已移除"); }
  catch(e){ toast("操作失败："+errMsg(e)); }
}
function seatDragStart(e,r,c){ dragData={type:"cell",r,c}; e.dataTransfer.effectAllowed="move"; }
function colDragStart(e,c){ dragData={type:"col",c}; e.dataTransfer.effectAllowed="move"; }
function seatDragOver(e,r,c){ e.preventDefault(); e.stopPropagation(); if(dragData)e.currentTarget.classList.add("drag-over"); }
function seatDragLeave(e){ e.currentTarget.classList.remove("drag-over"); }
async function swapSeats(tr,tc,from){
  let data=await fetchOne("seat_plans",{class_id:ST.classId}); if(!data||!data.grid.length){return;}
  const g=data.grid;
  if(from.type==="cell"){
    const sr=from.r,sc=from.c; if(!g[sr]||!g[sr][sc])return;
    const t=g[sr][sc]; g[sr][sc]=g[tr][tc]; g[tr][tc]=t;
  }else if(from.type==="col"){
    const c1=from.c,c2=tc; if(!g[0]||c2<0||c2>=g[0].length)return;
    for(let i=0;i<g.length;i++){ if(g[i][c1]!=null||g[i][c2]!=null){ const t=g[i][c1]; g[i][c1]=g[i][c2]; g[i][c2]=t; } }
  }
  await saveSeat(data.rows,data.cols,g);
}
async function seatDrop(e,r,c){ e.preventDefault(); e.stopPropagation(); e.currentTarget.classList.remove("drag-over"); if(!dragData)return; try{ await swapSeats(r,c,dragData); dragData=null; renderMain(); toast("座位已更新"); }catch(err){ dragData=null; toast("操作失败："+errMsg(err)); } }
async function colDrop(e,c){ e.preventDefault(); e.stopPropagation(); e.currentTarget.classList.remove("drag-over"); if(!dragData||dragData.type!=="col"){dragData=null;return;} try{ await swapSeats(0,c,dragData); dragData=null; renderMain(); toast("整组已换座"); }catch(err){ dragData=null; toast("操作失败："+errMsg(err)); } }
async function saveSeat(rows,cols,grid){ try{ const ex=await fetchOne("seat_plans",{class_id:ST.classId}); if(ex)await updateRows("seat_plans",{class_id:ST.classId},{rows,cols,grid}); else await insertRow("seat_plans",{class_id:ST.classId,rows,cols,grid}); }catch(e){ throw e; } }
async function buildSeats(){ const r=Math.min(15,Math.max(1,parseInt($id("se_r").value)||6)); const c=Math.min(15,Math.max(1,parseInt($id("se_c").value)||8)); try{ await saveSeat(r,c,Array.from({length:r},()=>Array(c).fill(null))); renderMain(); }catch(e){ toast("保存失败："+errMsg(e)); } }
async function clearSeats(){ try{ await saveSeat(6,8,Array.from({length:6},()=>Array(8).fill(null))); renderMain(); }catch(e){ toast("保存失败："+errMsg(e)); } }
async function autoSeat(){
  try{ let ms=await fetchRows("members",{eq:{class_id:ST.classId}}); let data=await fetchOne("seat_plans",{class_id:ST.classId});
    if(!data||!data.grid||!data.grid.length){ data={rows:6,cols:8,grid:Array.from({length:6},()=>Array(8).fill(null))}; }
    ms=ms.sort((a,b)=>(a.sid||"").localeCompare(b.sid||"",undefined,{numeric:true})); const flat=data.grid.flat(); const remain=ms.filter(m=>!flat.includes(m.id)); let k=0;
    const ng=data.grid.map(row=>row.map(x=>x||(remain[k]?remain[k++].id:null)));
    await saveSeat(data.rows,data.cols,ng); renderMain(); toast("自动排座完成");
  }catch(e){ toast("操作失败："+errMsg(e)); }
}

/* ===== 成绩管理（自定义科目 + 多次考试 + 并列同名次） ===== */
const SUBJECTS=["语文","数学","英语","科学","道法","音乐","美术","体育","劳动","信息技术"];

  const avg=rows.length?(rows.reduce((a,x)=>a+Number(x.score),0)/rows.length).toFixed(1):"—";

  <div class="card"><div class="card-title">科目设置</div>
    <div class="form-row"><div class="field" style="flex:1"><label>科目名称（可自由输入）</label><input id="sc_subject" value="${esc(subject)}" placeholder="如：数学 / 语文 / 英语"></div>
    <button class="btn btn-ghost btn-sm" onclick="pickSubject()">使用该科目</button></div>
    <div class="subj-chips">${SUBJECTS.map(sj=>`<span class="subj-chip" onclick="setSubjectInput('${esc(sj)}')">${sj}</span>`).join("")}</div></div>
  <div class="card"><div class="card-title">考试管理（${esc(subject||"未选科目")}）</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
      ${exams.length?exams.map(ex=>`<span class="chip ${exam===ex?"brand":"gray"}" style="cursor:pointer;font-size:13px;padding:7px 14px" onclick="pickExam('${esc(ex)}')">${esc(ex)}</span>`).join(""):'<span style="color:var(--muted);font-size:13px">还没有考试</span>'}
      <input id="new_exam" placeholder="新建考试名，如：单元测1 / 期末" style="margin-left:6px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;min-width:160px">
      <button class="btn btn-ghost btn-sm" onclick="addExam()">新建考试</button>
      ${exam?`<button class="btn btn-ghost btn-sm" onclick="clearExam()">清空本次考试</button>`:""}
    </div></div>

async function handleScoreScan(e){

    const prevInp=$id("sc_score");

  }catch(e){}

    const stu=await findMemberBySid(ST.classId,sid);

    const area=$id("sc_scan_area"); if(!area)return;

    const curScore=cur?cur.score:"";

    </div>

async function updateScoreRankBox(){

}

async function findMemberBySid(cid,sid){
  const trySids=[]; trySids.push(sid);
  const num=sid.replace(/^0+/,""); if(num&&num!==sid)trySids.push(num);
  const padded=String(parseInt(sid,10)||0).padStart(4,"0"); if(padded!==sid)trySids.push(padded);
  for(const s of trySids){ const m=await fetchOne("members",{class_id:cid,sid:s}); if(m)return m; }
  return null;
}

/* ===== 表现登记（当天好/差，可整批统一加减分） ===== */
let PERF={good:new Set(),bad:new Set()};
let PERF_MIDS=[];
function perfToday(){ const d=new Date(),p=n=>String(n).padStart(2,"0"); return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); }
function perfToggle(mid,v){
  if(v==="good"){ if(PERF.good.has(mid)){PERF.good.delete(mid);} else {PERF.good.add(mid);PERF.bad.delete(mid);} }
  else { if(PERF.bad.has(mid)){PERF.bad.delete(mid);} else {PERF.bad.add(mid);PERF.good.delete(mid);} }
  perfPaint(mid); perfCount();
}
function perfPaint(mid){
  const g=document.getElementById("pf_g_"+mid), b=document.getElementById("pf_b_"+mid);
  const on=PERF.good.has(mid), on2=PERF.bad.has(mid);
  if(g){ g.style.background=on?"#16a34a":"#fff"; g.style.color=on?"#fff":"#334155"; g.style.borderColor=on?"#16a34a":"#d7dee8"; }
  if(b){ b.style.background=on2?"#dc2626":"#fff"; b.style.color=on2?"#fff":"#334155"; b.style.borderColor=on2?"#dc2626":"#d7dee8"; }
}
function perfCount(){
  const g=document.getElementById("pf_cnt_g"), b=document.getElementById("pf_cnt_b");
  if(g)g.textContent=PERF.good.size; if(b)b.textContent=PERF.bad.size;
}
let PERF_LIST=[];
function perfFind(key){
  const k=String(key||"").trim(); if(!k)return null;
  const norm=s=>{const t=String(s||"").replace(/^0+/,"");return t||"0";};
  const nk=norm(k);
  return PERF_LIST.find(m=>norm(m.sid)===nk)
      || PERF_LIST.find(m=>(m.sid||"")===k)
      || PERF_LIST.find(m=>(m.name||"").includes(k))
      || null;
}
function perfScan(kind,inpId){
  const el=document.getElementById(inpId);
  const hit=perfFind(el&&el.value);
  if(!hit){ toast("没找到该学号 / 姓名"); if(el){el.value="";el.focus();} return; }
  const mid=hit.id;
  const was=kind==="good"?PERF.good.has(mid):PERF.bad.has(mid);
  if(was){ PERF.good.delete(mid); PERF.bad.delete(mid); }
  else if(kind==="good"){ PERF.good.add(mid); PERF.bad.delete(mid); }
  else { PERF.bad.add(mid); PERF.good.delete(mid); }
  perfPaint(mid); perfCount();
  const card=document.getElementById("pf_c_"+mid);
  if(card){ try{ card.scrollIntoView({block:"center",behavior:"smooth"}); }catch(e){} }
  toast(hit.name+" "+(hit.sid||"")+" "+(was?"已取消":(kind==="good"?"记为表现好":"记为表现差")));
  if(el){ el.value=""; el.focus(); }
}
function perfSelectAll(v){ PERF={good:new Set(),bad:new Set()}; PERF_MIDS.forEach(m=>{ if(v==="good")PERF.good.add(m); else PERF.bad.add(m); }); PERF_MIDS.forEach(m=>perfPaint(m)); perfCount(); }
function perfClearSel(){ PERF={good:new Set(),bad:new Set()}; PERF_MIDS.forEach(m=>perfPaint(m)); perfCount(); }
async function perfCommit(classId){
  classId=classId||ST.classId;
  const vgEl=document.getElementById("pf_vg"), vbEl=document.getElementById("pf_vb");
  const vg=Math.abs(parseFloat(vgEl&&vgEl.value)||2)||2;
  const vb=Math.abs(parseFloat(vbEl&&vbEl.value)||1)||1;
  const today=perfToday(); const rows=[];
  PERF.good.forEach(mid=>rows.push({class_id:classId,member_id:mid,cat:"表现好",value:vg,note:"",created_at:today}));
  PERF.bad.forEach(mid=>rows.push({class_id:classId,member_id:mid,cat:"表现差",value:-vb,note:"",created_at:today}));
  if(!rows.length){toast("请先选学生（可点“全选表现好/差”）");return;}
  const ng=PERF.good.size, nb=PERF.bad.size;
  try{
    const {error}=await sb.from("points").insert(rows); if(error)throw error;
    toast("已登记 "+(ng+nb)+" 人次（好 "+ng+" · 差 "+nb+"）");
    PERF={good:new Set(),bad:new Set()};
    if(typeof renderMain==="function")renderMain(); else renderBig();
  }catch(e){ toast("登记失败："+errMsg(e)); }
}

      <button class="btn btn-ghost btn-sm" onclick="perfClearSel()" style="height:42px;padding:0 16px">清空选择</button>
      <input id="pf_sg" placeholder="刷 / 输学号 → 记好" onkeydown="if(event.key==='Enter')perfScan('good','pf_sg')" style="width:222px;height:44px;font-size:16px;padding:0 12px;border:1px solid #bbf7d0;border-radius:10px;background:#f0fdf4">
      <input id="pf_sb" placeholder="刷 / 输学号 → 记差" onkeydown="if(event.key==='Enter')perfScan('bad','pf_sb')" style="width:222px;height:44px;font-size:16px;padding:0 12px;border:1px solid #fecaca;border-radius:10px;background:#fef2f2">
      <span style="font-size:15px;color:#475569">好 每人 +</span>
      <input id="pf_vg" type="number" min="1" value="2" style="width:88px;height:44px;font-size:20px;text-align:center;border:1px solid #d7dee8;border-radius:10px">
      <span style="font-size:15px;color:#475569">差 每人 −</span>
      <input id="pf_vb" type="number" min="1" value="1" style="width:88px;height:44px;font-size:20px;text-align:center;border:1px solid #d7dee8;border-radius:10px">
      <button class="btn btn-primary" onclick="perfCommit()" style="height:46px;padding:0 28px;font-size:16px">提交登记</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px">
      ${ms.map(m=>`<div id="pf_c_${m.id}" style="border:1px solid #e2e8f0;border-radius:10px;padding:10px;background:#fff">
        <div style="font-weight:700;font-size:15px;margin-bottom:8px">${esc(m.name)}<span style="color:#94a3b8;font-weight:400;font-size:12px;margin-left:6px">${esc(m.sid||"")}</span></div>
        <div style="display:flex;gap:6px">
          <button id="pf_g_${m.id}" class="btn btn-sm" style="flex:1;height:36px;background:#fff;color:#334155;border:1px solid #d7dee8;border-radius:8px" onclick="perfToggle('${m.id}','good')">好${gcnt[m.id]?" ×"+gcnt[m.id]:""}</button>
          <button id="pf_b_${m.id}" class="btn btn-sm" style="flex:1;height:36px;background:#fff;color:#334155;border:1px solid #d7dee8;border-radius:8px" onclick="perfToggle('${m.id}','bad')">差${bcnt[m.id]?" ×"+bcnt[m.id]:""}</button>
        </div>
      </div>`).join("")}
    </div>
  </div>
  <div class="card"><div class="card-title">今日明细（好 ${goodN} 人次 · 差 ${badN} 人次）</div>
    ${detail.length===0?'<div class="empty">今天还没有登记</div>':`<table class="tbl"><thead><tr><th>日期</th><th>学生</th><th>类别</th><th>分值</th><th>撤销</th></tr></thead><tbody>${detail.map(p=>{const mm=ms.find(x=>x.id===p.member_id);return `<tr><td>${String(p.created_at||"").slice(0,10)}</td><td>${mm?esc(mm.name):"?"}</td><td><span class="chip ${p.cat==="表现好"?"brand":"danger"}">${esc(p.cat)}</span></td><td style="font-weight:700;color:${p.value>=0?"var(--ok)":"var(--danger)"}">${p.value>0?"+"+p.value:p.value}</td><td><button class="btn btn-sm btn-danger" onclick="perfUndo('${esc(p.id)}')">撤销</button></td></tr>`;}).join("")}</tbody></table>`}
  </div>`;
}
async function perfUndo(id){ try{ await deleteRows("points",{id}); renderMain(); toast("已撤销"); }catch(e){ toast("撤销失败："+errMsg(e)); } }

/* ===== 积分商城 ===== */
async function viewShop(cls){
  let ms=[],items=[],red=[]; try{ ms=await fetchRows("members",{eq:{class_id:cls.id}}); items=await fetchRows("shop_items",{eq:{class_id:cls.id}}); red=await fetchRows("redemptions",{eq:{class_id:cls.id}}); }catch(e){}
  const sum={}; try{ const pts=await fetchRows("points",{eq:{class_id:cls.id}}); pts.forEach(p=>sum[p.member_id]=(sum[p.member_id]||0)+p.value); }catch(e){}
  return `<div class="page-head"><div><div class="page-title">积分商城</div><div class="page-desc">设置奖品，学生用积分兑换</div></div></div>
  <div class="card"><div class="card-title">添加奖品</div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px">
      <input class="inp" id="si_name" placeholder="奖品名称">
      <input class="inp" id="si_cost" type="number" placeholder="所需积分">
      <input class="inp" id="si_stock" type="number" placeholder="数量(空=不限)">
      <button class="btn btn-primary" onclick="shopAddItem()">添加</button>
    </div>
  </div>
  <div class="card"><div class="card-title">奖品列表</div>
    ${items.length===0?'<div class="empty">暂无奖品</div>':`<table class="tbl"><thead><tr><th>奖品</th><th>积分</th><th>剩余</th><th>已兑</th><th></th></tr></thead><tbody>${items.map(i=>{const used=red.filter(r=>r.item_id===i.id).length;return `<tr><td><b>${esc(i.name)}</b></td><td>${i.cost}</td><td>${i.stock==null?"不限":(i.stock-used)}</td><td>${used}</td><td><button class="btn btn-sm btn-danger" onclick="shopDelItem('${esc(i.id)}')">删</button></td></tr>`;}).join("")}</tbody></table>`}
  </div>
  <div class="card"><div class="card-title">兑换记录</div>
    ${red.length===0?'<div class="empty">暂无记录</div>':`<table class="tbl"><thead><tr><th>学生</th><th>奖品</th><th>积分</th><th>时间</th><th></th></tr></thead><tbody>${red.map(r=>{const m=ms.find(x=>x.id===r.member_id);return `<tr><td>${m?esc(m.name):"?"}</td><td>${esc(r.item_name)}</td><td>${r.cost}</td><td>${(r.created_at||"").slice(0,10)}</td><td><button class="btn btn-sm btn-danger" onclick="shopCancel('${esc(r.id)}')">取消</button></td></tr>`;}).join("")}</tbody></table>`}
  </div>`;
}
async function shopAddItem(){
  const name=$id("si_name").value.trim(),cost=parseInt($id("si_cost").value,10);
  if(!name||isNaN(cost)){toast("请填写奖品和积分");return;}
  const stock=$id("si_stock").value.trim()===""?null:parseInt($id("si_stock").value,10);
  try{ await insertRow("shop_items",{class_id:ST.classId,name,cost,stock}); renderMain(); toast("已添加奖品"); }catch(e){ toast("失败："+errMsg(e)); }
}
async function shopDelItem(id){ if(!confirm("删除该奖品？"))return; try{ await deleteRows("shop_items",{id}); renderMain(); }catch(e){ toast("失败："+errMsg(e)); } }
async function shopRedeem(mid,itemId,itemName,cost){
  const item=await fetchOne("shop_items",{id:itemId});
  const used=item.stock==null?0:((await fetchRows("redemptions",{eq:{class_id:ST.classId,item_id:itemId}})).length);
  if(item.stock!=null&&used>=item.stock){toast("奖品已兑完");return;}
  try{ await insertRow("redemptions",{class_id:ST.classId,member_id:mid,item_id:itemId,item_name:itemName,cost}); await insertRow("points",{class_id:ST.classId,member_id:mid,cat:"兑换:"+itemName,value:-cost,note:"",created_at:new Date().toISOString().slice(0,10)}); renderMain(); toast("已兑换"+itemName); }catch(e){ toast("兑换失败："+errMsg(e)); }
}
async function shopCancel(id){ if(!confirm("取消该兑换（返还积分）？"))return; try{ const rows=await fetchRows("redemptions",{eq:{id}}); if(rows.length){ await insertRow("points",{class_id:ST.classId,member_id:rows[0].member_id,cat:"退还兑换",value:rows[0].cost,note:"",created_at:new Date().toISOString().slice(0,10)}); } await deleteRows("redemptions",{id}); renderMain(); toast("已取消并返还积分"); }catch(e){ toast("失败："+errMsg(e)); } }

/* ===== 请假 / 缺勤（批量登记） ===== */
let LV_MS=[];
async function viewLeave(cls){
  const today=new Date().toISOString().slice(0,10);
  LV_MS=[]; try{ LV_MS=await fetchRows("members",{eq:{class_id:cls.id}}); }catch(e){}
  setTimeout(()=>{ if($id("lv_list"))lvRenderList(); },60);
  return `<div class="page-head"><div><div class="page-title">请假 / 缺勤</div><div class="page-desc">批量登记，按日期查看</div></div></div>
  <div class="card"><div class="card-title">批量登记</div>
    <div style="display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px;margin-bottom:4px">
      <div><label class="lab">学号 / 姓名（可扫码，输一个回车登记一个）</label>
        <input class="inp" id="lv_key" placeholder="输学号或姓名，输入即联想" style="height:56px;font-size:22px;padding:0 16px;border-radius:10px;margin-top:10px" oninput="lvSuggest()" onkeydown="if(event.key==='Enter')lvBatchAdd()"></div>
      <div><label class="lab">日期</label><input class="inp" id="lv_date" type="date" value="${today}" style="height:50px;font-size:19px;padding:0 12px;border-radius:10px;margin-top:10px"></div>
      <div><label class="lab">类型</label><select class="inp" id="lv_type" style="height:50px;font-size:19px;border-radius:10px;margin-top:10px"><option>请假</option><option>缺勤</option><option>迟到</option><option>早退</option></select></div>
    </div>
    <div id="lv_suggest" style="margin-top:8px;display:flex;flex-wrap:wrap;gap:8px"></div>
    <div style="margin-top:18px;margin-bottom:8px"><label class="lab">事由（本次批量共用，可空）</label><input class="inp" id="lv_reason" placeholder="原因" style="height:50px;font-size:19px;padding:0 14px;border-radius:10px"></div>
    <div id="lv_stu" style="margin-top:4px;display:flex;flex-wrap:wrap;gap:4px"></div>
  </div>
  <div class="card"><div class="card-title">记录</div>
    <div style="display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap">
      <span class="lab" style="margin:0">查看日期</span>
      <input class="inp" id="lv_qdate" type="date" value="${today}" style="width:auto;height:50px;font-size:19px;padding:0 12px;border-radius:10px" onchange="lvRenderList()">
    </div>
    <div id="lv_list"></div>
  </div>`;
}
async function lvDo(m){
  const date=$id("lv_date").value,type=$id("lv_type").value,reason=$id("lv_reason").value.trim();
  try{
    let ex=[]; try{ ex=await fetchRows("leaves",{eq:{class_id:ST.classId,date}}); }catch(e){}
    if(ex.some(x=>x.member_id===m.id)){ toast("已登记 "+m.name); hideSuggest(); $id("lv_key").value=""; $id("lv_key").focus(); return; }
    await insertRow("leaves",{class_id:ST.classId,member_id:m.id,date,type,reason});
    const box=$id("lv_stu"); box.insertAdjacentHTML("beforeend",`<span class="chip brand" style="margin:2px">${esc(m.name)} <span style="color:#b6bdf7">#${esc(m.sid||"")}</span></span>`);
    hideSuggest(); $id("lv_key").value=""; $id("lv_key").focus();
    if($id("lv_qdate").value===date) lvRenderList();
    toast("已登记 "+m.name);
  }catch(e){ toast("登记失败："+errMsg(e)); }
}
async function lvBatchAdd(){
  const key=($id("lv_key").value||"").trim();
  if(!key){toast("请输入学号或姓名");return;}
  let ms=LV_MS; if(!ms.length){ try{ ms=await fetchRows("members",{eq:{class_id:ST.classId}}); }catch(e){} }
  let m=ms.find(x=>(x.sid||"")===key)||ms.find(x=>(x.name||"")===key);
  if(!m){ const dz=key.replace(/\D/g,""); const dn=parseInt(dz,10); if(!isNaN(dn)){ m=ms.find(x=>parseInt(String(x.sid||"").replace(/\D/g,""),10)===dn); } }
  if(!m){toast("未找到学生："+key);return;}
  lvDo(m);
}
function lvSuggest(){
  const q=($id("lv_key").value||"").trim();
  const box=$id("lv_suggest"); if(!box)return;
  if(!q){ box.innerHTML=""; return; }
  const ms=LV_MS.length?LV_MS:(window.__lvMS||[]);
  const ql=q.toLowerCase();
  const hits=ms.filter(x=>(x.name||"").includes(q)||(x.sid||"").toLowerCase().includes(ql)||String(parseInt((x.sid||"").replace(/\D/g,""),10)||"")===String(parseInt(ql.replace(/\D/g,""),10)||"")).slice(0,14);
  box.innerHTML=hits.length?hits.map(x=>`<div style="background:var(--bg);border:1px solid var(--line);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:15px" onmouseover="this.style.borderColor='var(--brand)'" onmouseout="this.style.borderColor='var(--line)'" onclick="lvPickSug('${esc(x.id)}')">${esc(x.name)} <span style="color:var(--muted);font-size:13px">#${esc(x.sid||"")}</span></div>`).join(""):'<div style="padding:8px 2px;color:var(--muted);font-size:13px">无匹配学生</div>';
}
function lvPickSug(id){
  const m=LV_MS.find(x=>x.id===id); if(m)lvDo(m); else hideSuggest();
}
function hideSuggest(){ const b=$id("lv_suggest"); if(b)b.innerHTML=""; }
async function lvRenderList(){
  const qd=$id("lv_qdate").value;
  let ms=[],leaves=[]; try{ ms=await fetchRows("members",{eq:{class_id:ST.classId}}); leaves=await fetchRows("leaves",{eq:{class_id:ST.classId,date:qd}}); }catch(e){}
  leaves=leaves.sort((a,b)=>(b.created_at||"").localeCompare(a.created_at||""));
  $id("lv_list").innerHTML = leaves.length===0?'<div class="empty">该日期暂无记录</div>':`<table class="tbl"><thead><tr><th>学生</th><th>学号</th><th>类型</th><th>事由</th><th></th></tr></thead><tbody>${leaves.map(r=>{const m=ms.find(x=>x.id===r.member_id);return `<tr><td>${m?esc(m.name):"?"}</td><td>${m?esc(m.sid||""):""}</td><td><span class="chip ${r.type==="请假"?"brand":"danger"}">${esc(r.type)}</span></td><td>${esc(r.reason||"")}</td><td><button class="btn btn-sm btn-danger" onclick="lvDel('${esc(r.id)}')">删</button></td></tr>`;}).join("")}</tbody></table>`;
}
async function lvDel(id){ if(!confirm("删除该记录？"))return; try{ await deleteRows("leaves",{id}); lvRenderList(); }catch(e){ toast("删除失败："+errMsg(e)); } }

</script>
</body>
</html>
